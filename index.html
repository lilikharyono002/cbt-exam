<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT EXAM - SMP Muhammadiyah PKBS Surakarta</title>

    <!-- Terapkan tema sebelum render agar tidak berkedip -->
    <script>
        try {
            if ((localStorage.getItem('cbt_theme') || 'dark') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>

    <!-- Tailwind CSS CDN (darkMode dibuat berbasis class agar tombol tema berfungsi) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <!-- React & ReactDOM CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        /* Kolom isian harus tetap bisa diketik (terutama di Safari/iOS) */
        input, textarea, select {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
        }
        img { pointer-events: none; }
        .zoomable { pointer-events: auto; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root">
        <div class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 text-sm font-semibold">Memuat Aplikasi CBT EXAM...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Component } = React;

        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbztLyZuduyezaFqLLGK8hkg71lsiVxmrYTLEhteNx8ZCKUCabi8s-EIjYdLSYbXsYSy5g/exec";
        const SESSION_KEY = 'cbt_exam_session_data';
        const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 menit
        const MAX_VIOLATIONS = 3;
        const URAIAN_UNLOCK_RATIO = 0.55;
        const TRANSITION_SECONDS = 60;

        const LOGO_URL = "https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
        const LOGO_FALLBACK = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";

        const TYPE_LABELS = {
            'pilihan_ganda': 'Pilihan Ganda',
            'menjodohkan': 'Menjodohkan',
            'benar_salah': 'Benar - Salah',
            'uraian': 'Uraian (Lembar Kertas)'
        };

        const TYPE_ORDER = { 'pilihan_ganda': 1, 'menjodohkan': 2, 'benar_salah': 3, 'uraian': 4 };

        const MAPEL_LIST = [
            "PAI", "Kemuhammadiyahan", "Bahasa Indonesia", "Bahasa Arab", "IPA",
            "Seni Rupa", "PKn", "Bahasa Jawa", "Matematika", "Bahasa Inggris",
            "Informatika", "IPS", "Penjasorkes"
        ];

        const DEFAULT_QUESTIONS = [
            { mapel: "Matematika", kelas: "Kelas VII", id: 1, type: "pilihan_ganda",
              question: "Berapakah hasil dari 15 + (6 × 4) - 10?", imageUrl: "",
              options: ["29", "34", "39", "44"], correctAnswer: 0 },
            { mapel: "IPA", kelas: "Kelas VII", id: 2, type: "menjodohkan",
              question: "Pasangkanlah pernyataan di sebelah kiri dengan pasangan yang tepat di sebelah kanan:", imageUrl: "",
              pairs: [
                  { left: "Mitokondria", right: "Respirasi Sel & Energi" },
                  { left: "Ribosom", right: "Sintesis Protein" },
                  { left: "Kloroplas", right: "Fotosintesis Tumbuhan" }
              ] },
            { mapel: "Bahasa Indonesia", kelas: "Kelas VII", id: 3, type: "benar_salah",
              question: "Kalimat efektif harus memiliki minimal subjek dan predikat yang jelas.", imageUrl: "",
              correctAnswer: "BENAR" },
            { mapel: "PAI", kelas: "Kelas VII", id: 4, type: "uraian",
              question: "Jelaskan rukun shalat beserta syarat sahnya secara berurutan!", imageUrl: "" }
        ];

        // ---------- Fungsi bantu (murni, di luar komponen) ----------
        const formatImageUrl = (url) => {
            if (!url) return '';
            const trimmed = String(url).trim();
            let fileId = null;
            if (trimmed.includes('drive.google.com') || trimmed.includes('docs.google.com')) {
                const m1 = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
                const m2 = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (m1 && m1[1]) fileId = m1[1];
                else if (m2 && m2[1]) fileId = m2[1];
            }
            return fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : trimmed;
        };

        const sortQuestionsByRules = (qList) => {
            return [...qList].sort((a, b) => {
                const oa = TYPE_ORDER[a.type || 'pilihan_ganda'] || 1;
                const ob = TYPE_ORDER[b.type || 'pilihan_ganda'] || 1;
                if (oa !== ob) return oa - ob;
                return (Number(a.id) || 0) - (Number(b.id) || 0);
            });
        };

        const filterQuestionsFor = (all, mapel, kelas) => {
            const byMapel = all.filter(q => !q.mapel || q.mapel.toLowerCase() === (mapel || '').toLowerCase());
            const byKelas = byMapel.filter(q => !q.kelas || q.kelas === 'Semua Kelas' || q.kelas.toLowerCase() === (kelas || '').toLowerCase());
            return sortQuestionsByRules(byKelas.length > 0 ? byKelas : byMapel);
        };

        const isAnsweredQ = (q, ans) => {
            if (ans === undefined || ans === null || ans === '') return false;
            if (q.type === 'menjodohkan') return typeof ans === 'object' && Object.keys(ans).length > 0;
            return true;
        };

        const scoreFor = (activeQ, answers) => {
            const objectiveQ = activeQ.filter(q => q.type !== 'uraian');
            const total = objectiveQ.length;
            let correct = 0;
            objectiveQ.forEach((q) => {
                const ans = answers[q.id];
                if (q.type === 'pilihan_ganda' || q.type === 'benar_salah') {
                    if (ans === q.correctAnswer) correct++;
                } else if (q.type === 'menjodohkan') {
                    if (q.pairs && q.pairs.length > 0 && typeof ans === 'object' && ans !== null) {
                        const allMatch = q.pairs.every((p, i) => ans[i] === p.right);
                        if (allMatch) correct++;
                    }
                }
            });
            const score = total > 0 ? (correct / total) * 100 : 0;
            return { correct, total, score };
        };

        // Acak stabil (berdasarkan id soal) agar kolom kanan "Menjodohkan" tidak berurutan sama dengan kunci
        const shuffleSeeded = (arr, seed) => {
            const a = [...arr];
            let s = (Number(seed) || 1) % 2147483647;
            if (s <= 0) s += 2147483646;
            const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rnd() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const readStored = (key, fallback) => {
            try {
                const raw = localStorage.getItem(key);
                return raw ? { ...fallback, ...JSON.parse(raw) } : fallback;
            } catch (e) { return fallback; }
        };

        const saveSessionState = (data) => {
            try { localStorage.setItem(SESSION_KEY, JSON.stringify({ timestamp: Date.now(), data })); } catch (e) {}
        };
        const clearSessionState = () => { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} };

        const Logo = ({ className }) => (
            <img
                src={LOGO_URL}
                alt="Logo SMP Muhammadiyah PKBS Surakarta"
                className={className}
                onError={(e) => { e.target.onerror = null; e.target.src = LOGO_FALLBACK; }}
            />
        );

        // ---------- Error Boundary ----------
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, info) { console.error("CBT App Error:", error, info); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6 text-center">
                            <div className="max-w-md bg-slate-900 border border-red-500/40 p-6 rounded-3xl shadow-2xl">
                                <i className="fas fa-triangle-exclamation text-red-400 text-4xl mb-3"></i>
                                <h2 className="text-lg font-bold text-white mb-2">Terjadi Kendala Memuat Aplikasi</h2>
                                <p className="text-xs text-slate-400 mb-4">{this.state.error?.toString()}</p>
                                <button
                                    onClick={() => { clearSessionState(); window.location.reload(); }}
                                    className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/30"
                                >
                                    Reset & Muat Ulang
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            // ---------- Tema ----------
            const [theme, setTheme] = useState(() => {
                try { return localStorage.getItem('cbt_theme') || 'dark'; } catch (e) { return 'dark'; }
            });
            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                try { localStorage.setItem('cbt_theme', theme); } catch (e) {}
            }, [theme]);
            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            const t = {
                bg: theme === 'light' ? 'bg-slate-100 text-slate-800' : 'bg-slate-950 text-slate-100',
                card: theme === 'light' ? 'bg-white border border-slate-200/90 shadow-sm' : 'glass-panel border border-slate-800 shadow-2xl',
                cardInner: theme === 'light' ? 'bg-slate-50 border border-slate-200' : 'bg-slate-950/70 border border-slate-800',
                header: theme === 'light' ? 'bg-white/95 border-b border-slate-200 text-slate-800' : 'bg-slate-900/90 border-b border-slate-800/80 text-slate-100',
                sidebar: theme === 'light' ? 'bg-white border border-slate-200 shadow-sm' : 'bg-slate-900/80 border border-slate-800/80',
                title: theme === 'light' ? 'text-slate-900' : 'text-white',
                sub: theme === 'light' ? 'text-slate-600' : 'text-slate-400',
                label: theme === 'light' ? 'text-slate-700 font-semibold' : 'text-slate-300 font-semibold',
                input: theme === 'light' ? 'bg-white border border-slate-300 text-slate-900 placeholder:text-slate-400 focus:border-indigo-500' : 'bg-slate-950 border border-slate-700 text-white placeholder:text-slate-600 focus:border-indigo-500',
                select: theme === 'light' ? 'bg-white border border-slate-300 text-slate-900 focus:border-indigo-500' : 'bg-slate-900 border border-slate-700 text-white focus:border-indigo-500',
                optBg: theme === 'light' ? 'bg-white text-slate-900' : 'bg-slate-900 text-white',
                sidebarInactive: theme === 'light' ? 'text-slate-600 hover:bg-slate-100 hover:text-slate-900' : 'text-slate-400 hover:bg-slate-800 hover:text-white',
                btnSecondary: theme === 'light' ? 'bg-slate-200 hover:bg-slate-300 text-slate-700 border border-slate-300' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700',
                modalBg: theme === 'light' ? 'bg-slate-900/40 backdrop-blur-md' : 'bg-slate-950/80 backdrop-blur-md',
                modalContent: theme === 'light' ? 'bg-white border border-slate-200 text-slate-800 shadow-2xl' : 'glass-panel border border-slate-800 text-slate-100 shadow-2xl',
                option: theme === 'light' ? 'bg-white border-slate-200 text-slate-800 hover:border-indigo-400' : 'bg-slate-950/60 border-slate-800 text-slate-200 hover:border-indigo-500/60',
            };

            // ---------- State umum ----------
            const [role, setRole] = useState('siswa');
            const [step, setStep] = useState('login');

            const [student, setStudent] = useState({ name: '', nisn: '', kelas: 'Kelas VII', token: '' });
            const [selectedMapel, setSelectedMapel] = useState('');
            const [loginError, setLoginError] = useState('');
            const [zoomedImage, setZoomedImage] = useState(null);

            // Guru
            const [teacherPass, setTeacherPass] = useState('');
            const [teacherError, setTeacherError] = useState('');
            const [selectedTeacherMapel, setSelectedTeacherMapel] = useState('');
            const [activeGuruMenu, setActiveGuruMenu] = useState('input_soal');
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [deletingQId, setDeletingQId] = useState(null);
            const [filterDaftarKelas, setFilterDaftarKelas] = useState('ALL');
            const [copiedTokenMapel, setCopiedTokenMapel] = useState('');
            const [showPreviewModal, setShowPreviewModal] = useState(false);
            const [previewQIndex, setPreviewQIndex] = useState(0);

            // Database URL
            const [gasUrl, setGasUrl] = useState(() => {
                try {
                    const p = new URLSearchParams(window.location.search);
                    return p.get('gas') || localStorage.getItem('cbt_gas_url') || DEFAULT_GAS_URL;
                } catch (e) { return DEFAULT_GAS_URL; }
            });
            const [gasDraft, setGasDraft] = useState('');
            const [showSettingsModal, setShowSettingsModal] = useState(false);

            const [questions, setQuestions] = useState([]);
            // Token & durasi sekarang dikelola di server (Google Apps Script), bukan di browser
            const [examDuration, setExamDuration] = useState(60);
            const [isCheckingToken, setIsCheckingToken] = useState(false);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [tokenInfo, setTokenInfo] = useState(null);
            const [isLoadingToken, setIsLoadingToken] = useState(false);
            const [tokenError, setTokenError] = useState('');
            const [tokenDurasiInput, setTokenDurasiInput] = useState(60);
            const [tokenWindowInput, setTokenWindowInput] = useState(15);
            const [nowTick, setNowTick] = useState(Date.now());

            // Form input soal
            const emptyForm = () => ({
                question: '', imageUrl: '', options: ['', '', '', ''], correctAnswer: 0,
                pairs: [{ left: '', right: '' }, { left: '', right: '' }], trueFalseAnswer: 'BENAR'
            });
            const [selectedKelasInput, setSelectedKelasInput] = useState('Kelas VII');
            const [selectedTypeInput, setSelectedTypeInput] = useState('pilihan_ganda');
            const [formQuestion, setFormQuestion] = useState(emptyForm());
            const [formError, setFormError] = useState('');
            const [isSavingQuestion, setIsSavingQuestion] = useState(false);

            // Hasil ujian (guru)
            const [examResults, setExamResults] = useState([]);
            const [filterKelas, setFilterKelas] = useState('ALL');
            const [isLoadingResults, setIsLoadingResults] = useState(false);

            // Eksekusi ujian
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [flagged, setFlagged] = useState({});
            const [timeLeft, setTimeLeft] = useState(60 * 60);
            const [violations, setViolations] = useState([]);
            const [showViolationModal, setShowViolationModal] = useState(false);
            const [showSubmitModal, setShowSubmitModal] = useState(false);
            const [lockoutReason, setLockoutReason] = useState('');
            const [isSubmittingGas, setIsSubmittingGas] = useState(false);
            const [result, setResult] = useState({ correct: 0, total: 0, score: 0 });

            const [unlockedTypes, setUnlockedTypes] = useState({ 'pilihan_ganda': true });
            const [pendingTransition, setPendingTransition] = useState(null);
            const [transitionTimer, setTransitionTimer] = useState(TRANSITION_SECONDS);
            const [showUraianLockModal, setShowUraianLockModal] = useState(false);

            // Ref agar callback (timer & event listener) selalu memakai data terbaru
            const timerRef = useRef(null);
            const examActiveRef = useRef(false);
            const submittedRef = useRef(false);
            const lastViolationRef = useRef(0);
            const stateRef = useRef({});
            stateRef.current = { answers, violations, student, selectedMapel, gasUrl, questions };

            // ---------- Pulihkan sesi saat refresh ----------
            useEffect(() => {
                try {
                    const raw = localStorage.getItem(SESSION_KEY);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    if (parsed.timestamp && (Date.now() - parsed.timestamp < SESSION_TIMEOUT)) {
                        const s = parsed.data;
                        // Hanya sesi siswa yang dipulihkan. Guru cukup login ulang (password tidak disimpan di browser).
                        if (s && (s.step === 'instructions' || s.step === 'exam')) {
                            setRole('siswa');
                            setStep(s.step);
                            if (s.student) setStudent(s.student);
                            if (s.selectedMapel) setSelectedMapel(s.selectedMapel);
                            if (s.examDuration) setExamDuration(s.examDuration);
                            if (s.answers) setAnswers(s.answers);
                            if (s.flagged) setFlagged(s.flagged);
                            if (s.currentQIndex !== undefined) setCurrentQIndex(s.currentQIndex);
                            if (s.timeLeft !== undefined) setTimeLeft(s.timeLeft);
                            if (s.violations) setViolations(s.violations);
                            if (s.unlockedTypes) setUnlockedTypes(s.unlockedTypes);
                            if (s.step === 'exam') {
                                submittedRef.current = false;
                                examActiveRef.current = true;
                            }
                        }
                    } else {
                        localStorage.removeItem(SESSION_KEY);
                    }
                } catch (e) {
                    console.error("Gagal membaca sesi tersimpan:", e);
                }
            }, []);

            // ---------- Simpan sesi ----------
            useEffect(() => {
                if (step === 'instructions' || step === 'exam') {
                    saveSessionState({
                        step, student, selectedMapel, examDuration, answers, flagged,
                        currentQIndex, timeLeft, violations, unlockedTypes
                    });
                }
            }, [step, student, selectedMapel, examDuration, answers, flagged, currentQIndex, timeLeft, violations, unlockedTypes]);

            // Detik berjalan untuk hitung mundur masa berlaku token di dashboard guru
            useEffect(() => {
                if (step !== 'guru_dashboard') return;
                const id = setInterval(() => setNowTick(Date.now()), 1000);
                return () => clearInterval(id);
            }, [step]);

            // Panggilan GET ke Apps Script yang hasilnya perlu dibaca (validasi token, login guru, dsb.)
            const gasGet = async (params) => {
                const qs = new URLSearchParams(params).toString();
                const res = await fetch(`${gasUrl}${gasUrl.includes('?') ? '&' : '?'}${qs}`);
                return await res.json();
            };

            // ---------- Hitung mundur jeda pindah jenis soal ----------
            useEffect(() => {
                if (!pendingTransition || transitionTimer <= 0) return;
                const id = setInterval(() => setTransitionTimer(prev => Math.max(0, prev - 1)), 1000);
                return () => clearInterval(id);
            }, [pendingTransition, transitionTimer]);

            // ---------- Ambil soal dari Google Sheets ----------
            const fetchQuestionsFromGas = async (targetUrl) => {
                if (!targetUrl) return;
                try {
                    const res = await fetch(targetUrl);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        const cleaned = data.map((q, i) => {
                            const qType = q.type || 'pilihan_ganda';
                            return {
                                ...q,
                                id: q.id !== undefined && q.id !== '' ? q.id : i + 1,
                                type: qType,
                                imageUrl: formatImageUrl(q.imageUrl || q.image || ''),
                                options: Array.isArray(q.options) ? q.options.slice(0, 4) : ["A", "B", "C", "D"],
                                pairs: Array.isArray(q.pairs) ? q.pairs : [],
                                correctAnswer: q.correctAnswer !== undefined && q.correctAnswer !== ''
                                    ? (qType === 'pilihan_ganda' ? Number(q.correctAnswer) : q.correctAnswer)
                                    : (qType === 'benar_salah' ? 'BENAR' : 0)
                            };
                        });
                        setQuestions(sortQuestionsByRules(cleaned));
                    }
                } catch (err) {
                    console.error("Gagal mengambil soal dari Google Sheets:", err);
                }
            };

            useEffect(() => { if (gasUrl) fetchQuestionsFromGas(gasUrl); }, [gasUrl]);

            const openSettings = () => { setGasDraft(gasUrl); setShowSettingsModal(true); };
            const saveGasUrlSetting = () => {
                const trimmed = gasDraft.trim();
                try { localStorage.setItem('cbt_gas_url', trimmed); } catch (e) {}
                setGasUrl(trimmed);
                setShowSettingsModal(false);
            };

            const requestFullscreenMode = () => {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
            };

            // ---------- Kumpulkan ujian ----------
            const submitExam = async (forced = false, reason = '', violationsOverride = null) => {
                if (submittedRef.current) return;
                submittedRef.current = true;
                examActiveRef.current = false;
                if (timerRef.current) clearInterval(timerRef.current);

                const s = stateRef.current;
                const vio = violationsOverride || s.violations;

                if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                setShowSubmitModal(false);
                setShowViolationModal(false);
                setShowUraianLockModal(false);
                setPendingTransition(null);
                clearSessionState();

                const activeQ = filterQuestionsFor(s.questions, s.selectedMapel, s.student.kelas);
                const { correct, total, score } = scoreFor(activeQ, s.answers);
                setResult({ correct, total, score });
                setStep('result');

                if (s.gasUrl) {
                    setIsSubmittingGas(true);
                    const payload = {
                        action: 'submitExam',
                        name: s.student.name,
                        nisn: s.student.nisn,
                        kelas: s.student.kelas,
                        mapel: s.selectedMapel,
                        score: score.toFixed(1),
                        correct,
                        total,
                        violationsCount: vio.length,
                        violationDetails: vio.map(v => `[${v.time}] ${v.reason}`).join(' | ') || 'Tidak ada pelanggaran',
                        status: reason || (forced ? 'Diskualifikasi / Dihentikan Sistem' : 'Selesai Tepat Waktu')
                    };
                    try {
                        await fetch(s.gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });
                    } catch (e) {
                        console.error("Gagal mengirim data ke Google Sheets", e);
                    } finally {
                        setIsSubmittingGas(false);
                    }
                }
            };

            // ---------- Pelanggaran ----------
            const addViolation = (reason) => {
                if (!examActiveRef.current) return;
                const now = Date.now();
                if (now - lastViolationRef.current < 1500) return;
                lastViolationRef.current = now;

                const entry = { time: new Date().toLocaleTimeString('id-ID'), reason };
                const newViolations = [...stateRef.current.violations, entry];
                stateRef.current.violations = newViolations;
                setViolations(newViolations);

                if (newViolations.length >= MAX_VIOLATIONS) {
                    setLockoutReason(`Ujian dihentikan otomatis karena mencapai batas maksimum pelanggaran (${MAX_VIOLATIONS}x).`);
                    submitExam(true, `Mencapai batas ${MAX_VIOLATIONS} pelanggaran security.`, newViolations);
                } else {
                    setShowViolationModal(true);
                }
            };

            useEffect(() => {
                if (step !== 'exam') return;

                const onVisibility = () => { if (document.hidden) addViolation("Pindah Tab / Membuka Aplikasi Lain"); };
                const onBlur = () => addViolation("Kursor/Fokus Meninggalkan Layar Ujian");
                const onFullscreen = () => {
                    if (!document.fullscreenElement) addViolation("Keluar dari Mode Layar Penuh (Fullscreen)");
                };
                const onKeyDown = (e) => {
                    const k = (e.key || '').toLowerCase();
                    const mod = e.ctrlKey || e.metaKey;
                    if (
                        e.key === 'F12' || e.key === 'PrintScreen' ||
                        (mod && e.shiftKey && ['i', 'j', 'c'].includes(k)) ||
                        (mod && ['u', 'c', 'v', 'x', 'a', 'p', 's'].includes(k))
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        addViolation(`Percobaan Kombinasi Tombol Terlarang (${e.key})`);
                        return false;
                    }
                };
                const onContext = (e) => { e.preventDefault(); addViolation("Klik Kanan Terdeteksi"); return false; };
                const onCopyPaste = (e) => { e.preventDefault(); addViolation("Percobaan Salin / Tempel Teks (Copy-Paste)"); return false; };

                document.addEventListener('visibilitychange', onVisibility);
                window.addEventListener('blur', onBlur);
                document.addEventListener('fullscreenchange', onFullscreen);
                window.addEventListener('keydown', onKeyDown);
                document.addEventListener('contextmenu', onContext);
                document.addEventListener('copy', onCopyPaste);
                document.addEventListener('paste', onCopyPaste);
                document.addEventListener('cut', onCopyPaste);
                return () => {
                    document.removeEventListener('visibilitychange', onVisibility);
                    window.removeEventListener('blur', onBlur);
                    document.removeEventListener('fullscreenchange', onFullscreen);
                    window.removeEventListener('keydown', onKeyDown);
                    document.removeEventListener('contextmenu', onContext);
                    document.removeEventListener('copy', onCopyPaste);
                    document.removeEventListener('paste', onCopyPaste);
                    document.removeEventListener('cut', onCopyPaste);
                };
            }, [step]);

            // ---------- Timer ujian ----------
            useEffect(() => {
                if (step !== 'exam') return;
                timerRef.current = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            clearInterval(timerRef.current);
                            setTimeout(() => submitExam(false, "Selesai - Waktu Ujian Habis"), 0);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [step]);

            // ---------- Alur siswa ----------
            const startStudentExam = async () => {
                if (isCheckingToken) return;
                setLoginError('');
                if (!student.name.trim() || !student.nisn.trim()) {
                    setLoginError("Mohon lengkapi Nama Lengkap dan NISN Siswa!");
                    return;
                }
                if (!student.token.trim()) {
                    setLoginError("Mohon masukkan Token Ujian yang diberikan oleh Guru!");
                    return;
                }
                if (!gasUrl) {
                    setLoginError("Aplikasi belum terhubung ke database. Hubungi guru/pengawas.");
                    return;
                }

                setIsCheckingToken(true);
                try {
                    // Token divalidasi di server: harus aktif, belum kedaluwarsa, dan siswa belum pernah mengerjakan mapel ini
                    const r = await gasGet({
                        action: 'validateToken',
                        token: student.token.trim().toUpperCase(),
                        nisn: student.nisn.trim(),
                        kelas: student.kelas
                    });
                    if (!r || !r.ok) {
                        setLoginError((r && r.message) || "Token Ujian tidak valid. Silakan minta token aktif kepada Guru/Pengawas.");
                        return;
                    }
                    if (filterQuestionsFor(questions, r.mapel, student.kelas).length === 0) {
                        setLoginError(`Belum ada soal tersedia di bank soal untuk Mata Pelajaran "${r.mapel}".`);
                        return;
                    }
                    setExamDuration(Number(r.durasi) || 60);
                    setSelectedMapel(r.mapel);
                    setStep('instructions');
                } catch (e) {
                    setLoginError("Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.");
                } finally {
                    setIsCheckingToken(false);
                }
            };

            const getActiveQuestions = () => filterQuestionsFor(questions, selectedMapel, student.kelas);

            const beginTest = () => {
                const activeQ = getActiveQuestions();
                const firstType = (activeQ[0] && activeQ[0].type) || 'pilihan_ganda';
                requestFullscreenMode();
                submittedRef.current = false;
                examActiveRef.current = true;
                lastViolationRef.current = Date.now();
                setAnswers({});
                setFlagged({});
                setViolations([]);
                stateRef.current.violations = [];
                setLockoutReason('');
                setCurrentQIndex(0);
                setUnlockedTypes({ [firstType]: true });
                setPendingTransition(null);
                setTimeLeft(examDuration * 60);
                setStep('exam');
            };

            const navigateToQuestion = (targetIndex) => {
                const activeQ = getActiveQuestions();
                const targetQ = activeQ[targetIndex];
                if (!targetQ) return;
                const targetType = targetQ.type || 'pilihan_ganda';
                const totalSec = examDuration * 60;
                const elapsed = totalSec - timeLeft;

                if (targetType === 'uraian' && elapsed < totalSec * URAIAN_UNLOCK_RATIO) {
                    setShowUraianLockModal(true);
                    return;
                }
                if (!unlockedTypes[targetType]) {
                    setPendingTransition({ targetIndex, targetType });
                    setTransitionTimer(TRANSITION_SECONDS);
                    return;
                }
                setCurrentQIndex(targetIndex);
            };

            const setAnswer = (qId, value) => setAnswers(prev => ({ ...prev, [qId]: value }));
            const setMatchAnswer = (q, pIdx, value) => {
                setAnswers(prev => {
                    const cur = { ...((typeof prev[q.id] === 'object' && prev[q.id]) || {}) };
                    if (value === '') delete cur[pIdx]; else cur[pIdx] = value;
                    return { ...prev, [q.id]: cur };
                });
            };
            const toggleFlag = (qId) => setFlagged(prev => ({ ...prev, [qId]: !prev[qId] }));

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // ---------- Alur guru ----------
            const postToGas = async (payload, label) => {
                if (!gasUrl) return;
                try {
                    // Aksi guru (tambah/ubah/hapus soal) wajib menyertakan password; diperiksa di server
                    await fetch(gasUrl, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ ...payload, pass: teacherPass })
                    });
                } catch (e) { console.error(label, e); }
            };

            const handleTeacherLogin = async () => {
                if (isLoggingIn) return;
                setTeacherError('');
                if (!gasUrl) {
                    setTeacherError("Hubungkan database dulu (klik \"Set Web App URL\" di bawah), karena password guru diperiksa di server.");
                    return;
                }
                if (!teacherPass) {
                    setTeacherError("Password guru wajib diisi.");
                    return;
                }
                setIsLoggingIn(true);
                try {
                    const r = await gasGet({ action: 'loginGuru', pass: teacherPass });
                    if (r && r.ok) {
                        setSelectedTeacherMapel('');
                        setTokenInfo(null);
                        setStep('guru_dashboard');
                        fetchResultsFromGas();
                    } else {
                        setTeacherError((r && r.message) || "Password Guru salah!");
                    }
                } catch (e) {
                    setTeacherError("Tidak dapat terhubung ke server. Periksa koneksi internet dan URL Web App.");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const selectSubjectForTeacher = (m) => {
                setSelectedTeacherMapel(m);
                setTokenInfo(null);
                setTokenError('');
                setActiveGuruMenu('input_soal');
                setFormError('');
            };

            const handleSaveQuestion = async () => {
                setFormError('');
                if (!selectedTeacherMapel) return;

                if (selectedTypeInput !== 'menjodohkan' && !formQuestion.question.trim()) {
                    setFormError("Teks pertanyaan wajib diisi.");
                    return;
                }
                if (selectedTypeInput === 'pilihan_ganda' && formQuestion.options.some(o => !o.trim())) {
                    setFormError("Semua pilihan jawaban A-D wajib diisi.");
                    return;
                }
                const validPairs = formQuestion.pairs.filter(p => p.left.trim() && p.right.trim());
                if (selectedTypeInput === 'menjodohkan' && validPairs.length < 2) {
                    setFormError("Soal menjodohkan minimal memiliki 2 pasangan yang terisi lengkap.");
                    return;
                }

                setIsSavingQuestion(true);
                const newQ = {
                    mapel: selectedTeacherMapel,
                    kelas: selectedKelasInput,
                    id: Date.now(),
                    type: selectedTypeInput,
                    question: selectedTypeInput === 'menjodohkan'
                        ? (formQuestion.question.trim() || 'Pasangkanlah pernyataan di sebelah kiri dengan pasangan yang tepat di sebelah kanan:')
                        : formQuestion.question,
                    imageUrl: selectedTypeInput === 'menjodohkan' ? '' : formatImageUrl(formQuestion.imageUrl)
                };
                if (selectedTypeInput === 'pilihan_ganda') {
                    newQ.options = [...formQuestion.options];
                    newQ.correctAnswer = parseInt(formQuestion.correctAnswer);
                } else if (selectedTypeInput === 'menjodohkan') {
                    newQ.pairs = validPairs;
                } else if (selectedTypeInput === 'benar_salah') {
                    newQ.correctAnswer = formQuestion.trueFalseAnswer;
                }

                setQuestions(prev => sortQuestionsByRules([...prev, newQ]));
                await postToGas({ action: 'addQuestion', ...newQ }, "Gagal menyimpan ke Google Sheets");
                setFormQuestion(emptyForm());
                setIsSavingQuestion(false);
            };

            const handleSaveEditQuestion = async () => {
                if (!editingQuestion) return;
                const updatedQ = { ...editingQuestion };
                if (updatedQ.type !== 'menjodohkan' && !String(updatedQ.question || '').trim()) return;
                if (updatedQ.type === 'menjodohkan') {
                    updatedQ.pairs = (updatedQ.pairs || []).filter(p => p.left.trim() && p.right.trim());
                }
                updatedQ.imageUrl = formatImageUrl(updatedQ.imageUrl);
                setQuestions(prev => sortQuestionsByRules(prev.map(q => q.id === updatedQ.id ? updatedQ : q)));
                setEditingQuestion(null);
                await postToGas({ action: 'updateQuestion', ...updatedQ }, "Gagal memperbarui soal di Google Sheets");
            };

            const confirmDeleteQuestion = async () => {
                if (deletingQId === null) return;
                const targetId = deletingQId;
                setQuestions(prev => prev.filter(q => q.id !== targetId));
                setDeletingQId(null);
                await postToGas({ action: 'deleteQuestion', id: targetId }, "Gagal menghapus soal dari Google Sheets");
            };

            // ---------- Token ujian (disimpan di sheet "Token") ----------
            const fetchTokenInfo = async (mapel = selectedTeacherMapel) => {
                if (!gasUrl || !mapel) return;
                setIsLoadingToken(true);
                setTokenError('');
                try {
                    const r = await gasGet({ action: 'getToken', pass: teacherPass, mapel });
                    if (r && r.ok) {
                        setTokenInfo(r.token ? { ...r, fetchedAt: Date.now() } : null);
                    } else {
                        setTokenInfo(null);
                        setTokenError((r && r.message) || "Gagal memuat token.");
                    }
                } catch (e) {
                    setTokenError("Gagal terhubung ke server.");
                } finally {
                    setIsLoadingToken(false);
                }
            };

            const generateNewToken = async () => {
                if (!gasUrl || !selectedTeacherMapel) return;
                setIsLoadingToken(true);
                setTokenError('');
                try {
                    const r = await gasGet({
                        action: 'generateToken',
                        pass: teacherPass,
                        mapel: selectedTeacherMapel,
                        durasi: tokenDurasiInput,
                        menit: tokenWindowInput
                    });
                    if (r && r.ok) setTokenInfo({ ...r, fetchedAt: Date.now() });
                    else setTokenError((r && r.message) || "Gagal membuat token.");
                } catch (e) {
                    setTokenError("Gagal terhubung ke server.");
                } finally {
                    setIsLoadingToken(false);
                }
            };

            const closeToken = async () => {
                if (!gasUrl || !selectedTeacherMapel) return;
                setIsLoadingToken(true);
                setTokenError('');
                try {
                    const r = await gasGet({ action: 'closeToken', pass: teacherPass, mapel: selectedTeacherMapel });
                    if (r && r.ok) await fetchTokenInfo();
                    else setTokenError((r && r.message) || "Gagal menutup token.");
                } catch (e) {
                    setTokenError("Gagal terhubung ke server.");
                } finally {
                    setIsLoadingToken(false);
                }
            };

            const copyToClipboard = async (text, mapel) => {
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    const dummy = document.createElement("input");
                    document.body.appendChild(dummy);
                    dummy.value = text;
                    dummy.select();
                    try { document.execCommand("copy"); } catch (err) {}
                    document.body.removeChild(dummy);
                }
                setCopiedTokenMapel(mapel);
                setTimeout(() => setCopiedTokenMapel(''), 2000);
            };

            const fetchResultsFromGas = async () => {
                if (!gasUrl) return;
                setIsLoadingResults(true);
                try {
                    const data = await gasGet({ action: 'getResults', pass: teacherPass });
                    if (Array.isArray(data)) setExamResults(data);
                } catch (err) {
                    console.error("Gagal menarik hasil ujian:", err);
                } finally {
                    setIsLoadingResults(false);
                }
            };

            const filteredResults = examResults.filter(res =>
                (filterKelas === 'ALL' || res.kelas === filterKelas) &&
                (res.mapel && res.mapel.toLowerCase() === (selectedTeacherMapel || '').toLowerCase())
            );

            const handleExportCSV = () => {
                if (filteredResults.length === 0) return;
                const headers = ["Waktu Selesai", "Nama Siswa", "NISN", "Kelas", "Mata Pelajaran", "Skor", "Jumlah Benar", "Total Soal", "Jumlah Pelanggaran", "Detail Pelanggaran", "Status"];
                const esc = (v) => `"${String(v === undefined || v === null ? '' : v).replace(/"/g, '""')}"`;
                const rows = filteredResults.map(r => [
                    r.time, r.name, r.nisn, r.kelas, r.mapel, r.score, r.correct, r.total,
                    r.violationsCount, r.violationDetails, r.status
                ].map(esc));
                const csv = "\uFEFF" + [headers.map(esc).join(","), ...rows.map(r => r.join(","))].join("\n");
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `Hasil_Ujian_${selectedTeacherMapel.replace(/\s+/g, '_')}_${filterKelas === 'ALL' ? 'SemuaKelas' : filterKelas.replace(/\s+/g, '_')}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const handleLogout = () => {
                examActiveRef.current = false;
                clearSessionState();
                setStep('login');
                setStudent({ name: '', nisn: '', kelas: 'Kelas VII', token: '' });
                setTeacherPass('');
                setSelectedTeacherMapel('');
                setSelectedMapel('');
                setTokenInfo(null);
                setTokenError('');
            };

            // ---------- Modal global (tampil di semua layar) ----------
            const globalModals = (
                <React.Fragment>
                    {showSettingsModal && (
                        <div className={`fixed inset-0 ${t.modalBg} z-[60] flex items-center justify-center p-4`}>
                            <div className={`${t.modalContent} rounded-3xl p-6 max-w-lg w-full`}>
                                <h3 className={`text-base font-bold ${t.title} mb-2 flex items-center gap-2`}>
                                    <i className="fas fa-link text-indigo-500"></i> Pengaturan URL Google Apps Script
                                </h3>
                                <p className={`text-xs ${t.sub} mb-4 leading-relaxed`}>
                                    Tempelkan Web App URL dari Google Apps Script Anda. Seluruh komputer siswa yang membuka link web ini akan terhubung ke database spreadsheet Anda.
                                </p>
                                <input
                                    type="text"
                                    placeholder="https://script.google.com/macros/s/AKfycbx.../exec"
                                    className={`w-full ${t.input} rounded-2xl p-3.5 text-xs mb-4 transition`}
                                    value={gasDraft}
                                    onChange={(e) => setGasDraft(e.target.value)}
                                />
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowSettingsModal(false)} className={`px-4 py-2.5 rounded-xl text-xs font-medium transition ${t.btnSecondary}`}>Batal</button>
                                    <button onClick={saveGasUrlSetting} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition">Simpan & Aktifkan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {zoomedImage && (
                        <div className={`fixed inset-0 ${t.modalBg} z-[70] flex items-center justify-center p-4`} onClick={() => setZoomedImage(null)}>
                            <div className={`relative max-w-4xl max-h-[90vh] p-2 ${t.modalContent} rounded-3xl overflow-hidden`} onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => setZoomedImage(null)} className={`absolute top-4 right-4 w-10 h-10 rounded-2xl flex items-center justify-center text-base z-10 transition shadow-lg ${t.btnSecondary}`}>
                                    <i className="fas fa-xmark"></i>
                                </button>
                                <img src={zoomedImage} alt="Zoomed" className="max-h-[85vh] max-w-full object-contain rounded-2xl mx-auto" />
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
            const withModals = (node) => <React.Fragment>{node}{globalModals}</React.Fragment>;

            const dbLabel = gasUrl ? "Terhubung ke Google Sheets" : "Set Web App URL";

            // =====================================================
            // LAYAR 1: LOGIN
            // =====================================================
            if (step === 'login') {
                return withModals(
                    <div className={`min-h-screen ${t.bg} flex flex-col justify-center items-center p-4 relative overflow-hidden transition-colors duration-300`}>
                        <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute bottom-10 right-10 w-80 h-80 bg-violet-600/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div className="w-full max-w-md relative z-10">
                            <div className={`${t.card} rounded-3xl p-7 sm:p-9 transition-colors duration-300`}>
                                <div className="text-center mb-8">
                                    <div className="w-20 h-20 bg-slate-900/90 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30 p-2 shadow-lg shadow-indigo-500/10">
                                        <Logo className="w-full h-full object-contain" />
                                    </div>
                                    <h1 className={`text-2xl font-black ${t.title} tracking-tight`}>CBT EXAM</h1>
                                    <p className="text-indigo-600 dark:text-indigo-400 font-semibold text-xs mt-1 tracking-wide uppercase">SMP Muhammadiyah PKBS Surakarta</p>
                                </div>

                                <div className={`flex ${theme === 'light' ? 'bg-slate-100 border-slate-200' : 'bg-slate-900/80 border-slate-800'} p-1.5 rounded-2xl mb-6 border`}>
                                    <button
                                        onClick={() => { setRole('siswa'); setLoginError(''); }}
                                        className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-center gap-2 ${role === 'siswa' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30' : t.sub}`}
                                    >
                                        <i className="fas fa-user-graduate text-sm"></i> Portal Siswa
                                    </button>
                                    <button
                                        onClick={() => { setRole('guru'); setTeacherError(''); }}
                                        className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-center gap-2 ${role === 'guru' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30' : t.sub}`}
                                    >
                                        <i className="fas fa-chalkboard-user text-sm"></i> Portal Guru
                                    </button>
                                </div>

                                {role === 'siswa' && (
                                    <div className="space-y-4">
                                        {loginError && (
                                            <div className="bg-red-500/10 border border-red-500/40 rounded-2xl p-3.5 text-xs text-red-600 dark:text-red-300 flex items-start gap-2.5">
                                                <i className="fas fa-circle-exclamation text-red-500 text-sm mt-0.5 shrink-0"></i>
                                                <span className="leading-relaxed font-medium">{loginError}</span>
                                            </div>
                                        )}

                                        <div>
                                            <label className={`block text-xs ${t.label} mb-1.5`}>Nama Lengkap Siswa</label>
                                            <div className={`relative rounded-2xl ${t.input} transition-all`}>
                                                <i className="fas fa-user text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 text-xs"></i>
                                                <input
                                                    type="text"
                                                    placeholder="Contoh: Ahmad Subagja"
                                                    className="w-full bg-transparent border-0 pl-10 pr-4 py-3 text-xs sm:text-sm focus:outline-none"
                                                    value={student.name}
                                                    onChange={(e) => setStudent({ ...student, name: e.target.value })}
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className={`block text-xs ${t.label} mb-1.5`}>NISN / ID Siswa</label>
                                                <div className={`relative rounded-2xl ${t.input} transition-all h-[42px] flex items-center`}>
                                                    <i className="fas fa-id-card text-slate-400 absolute left-3.5 text-xs"></i>
                                                    <input
                                                        type="text"
                                                        placeholder="00123456"
                                                        className="w-full bg-transparent border-0 pl-9 pr-3 py-2 text-xs focus:outline-none font-mono"
                                                        value={student.nisn}
                                                        onChange={(e) => setStudent({ ...student, nisn: e.target.value })}
                                                    />
                                                </div>
                                            </div>
                                            <div>
                                                <label className={`block text-xs ${t.label} mb-1.5`}>Kelas Siswa</label>
                                                <div className={`relative rounded-2xl ${t.input} transition-all h-[42px] flex items-center`}>
                                                    <select
                                                        className="w-full bg-transparent border-0 px-3 py-2 text-xs focus:outline-none cursor-pointer"
                                                        value={student.kelas}
                                                        onChange={(e) => setStudent({ ...student, kelas: e.target.value })}
                                                    >
                                                        <option value="Kelas VII" className={t.optBg}>Kelas VII</option>
                                                        <option value="Kelas VIII" className={t.optBg}>Kelas VIII</option>
                                                        <option value="Kelas IX" className={t.optBg}>Kelas IX</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <label className={`block text-xs ${t.label} mb-1.5`}>
                                                Token Ujian <span className="text-indigo-600 dark:text-indigo-400 font-normal">(Dari Guru)</span>
                                            </label>
                                            <div className={`relative rounded-2xl ${t.input} transition-all`}>
                                                <i className="fas fa-key text-indigo-500 absolute left-4 top-1/2 -translate-y-1/2 text-xs"></i>
                                                <input
