<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT EXAM - SMP Muhammadiyah PKBS Surakarta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        img {
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-indigo:focus-within {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
        }
        /* Custom scrollbar for modern feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel" data-compact="true">
        const { useState, useEffect, useRef } = React;

        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbztLyZuduyezaFqLLGK8hkg71lsiVxmrYTLEhteNx8ZCKUCabi8s-EIjYdLSYbXsYSy5g/exec";

        const MAX_VIOLATIONS = 3;
        const DURATION_MINUTES = 15;

        function App() {
            const [role, setRole] = useState('siswa'); // 'siswa' or 'guru'
            const [step, setStep] = useState('login'); // 'login', 'guru_dashboard', 'instructions', 'exam', 'result'
            
            // Student login state (Token-only login)
            const [student, setStudent] = useState({ name: '', nisn: '', kelas: 'Kelas VII', token: '' });
            const [selectedMapel, setSelectedMapel] = useState('');
            const [selectedKelas, setSelectedKelas] = useState('Kelas VII');
            const [loginError, setLoginError] = useState('');
            
            // Teacher login & dashboard state
            const [teacherPass, setTeacherPass] = useState('');
            const [teacherError, setTeacherError] = useState('');
            const [activeGuruMenu, setActiveGuruMenu] = useState('input_soal'); // 'input_soal', 'daftar_soal', 'hasil_ujian', 'generate_token'
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [deletingQId, setDeletingQId] = useState(null);
            const [filterDaftarMapel, setFilterDaftarMapel] = useState('ALL');
            const [filterDaftarKelas, setFilterDaftarKelas] = useState('ALL');
            const [copiedTokenMapel, setCopiedTokenMapel] = useState('');
            
            // Database URL state
            const [gasUrl, setGasUrl] = useState(() => {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('gas') || localStorage.getItem('cbt_gas_url') || DEFAULT_GAS_URL;
            });

            const [questions, setQuestions] = useState([]);
            const [mapelList] = useState(["PAI", "Kemuhammadiyahan", "Bahasa Indonesia", "Bahasa Arab", "IPA", "Seni Rupa", "PKn", "Bahasa Jawa", "Matematika", "Bahasa Inggris", "Informatika", "IPS", "Penjasorkes"]);
            const [kelasList] = useState(["Semua Kelas", "Kelas VII", "Kelas VIII", "Kelas IX"]);

            const [tokens, setTokens] = useState({
                 "PAI": "8PAI89",
                "Kemuhammadiyahan": "KMH564",
                "Bahasa Indonesia": "B099I8",
                "Bahasa Arab": "BA6754",
                "IPA": "65IPA7",
                "Seni Rupa": "SR653U",
                "PKn": "PKN543",
                "Bahasa Jawa": "8769BJ",
                "Penjasorkes": "PJOK56",
                "Matematika": "MTK882",
                "Bahasa Inggris": "BIO123",
                "Informatika": "CBT2026",
                "IPS": "BIN771"
            });

            // Form Input Soal State (Guru)
            const [selectedMapelInput, setSelectedMapelInput] = useState('PKn');
            const [selectedKelasInput, setSelectedKelasInput] = useState('Kelas VII');
            const [formQuestion, setFormQuestion] = useState({
                question: '',
                options: ['', '', '', ''],
                correctAnswer: 0
            });
            const [isSavingQuestion, setIsSavingQuestion] = useState(false);

            // Hasil Ujian Teacher State
            const [examResults, setExamResults] = useState([]);
            const [filterKelas, setFilterKelas] = useState('ALL');
            const [filterHasilMapel, setFilterHasilMapel] = useState('ALL');
            const [isLoadingResults, setIsLoadingResults] = useState(false);

            // Exam execution state
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [flagged, setFlagged] = useState({});
            const [timeLeft, setTimeLeft] = useState(DURATION_MINUTES * 60);
            const [violations, setViolations] = useState([]);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [showViolationModal, setShowViolationModal] = useState(false);
            const [showSubmitModal, setShowSubmitModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [lockoutReason, setLockoutReason] = useState('');
            const [lastViolationTime, setLastViolationTime] = useState(0);
            const [isSubmittingGas, setIsSubmittingGas] = useState(false);

            const timerRef = useRef(null);

            useEffect(() => {
                if (gasUrl) {
                    localStorage.setItem('cbt_gas_url', gasUrl);
                    fetchQuestionsFromGas(gasUrl);
                }
            }, [gasUrl]);

            const fetchQuestionsFromGas = async (targetUrl = gasUrl) => {
                if (!targetUrl) return;
                try {
                    const res = await fetch(targetUrl);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const cleanedData = data.map(q => ({
                            ...q,
                            options: Array.isArray(q.options) ? q.options.slice(0, 4) : ["A", "B", "C", "D"],
                            correctAnswer: typeof q.correctAnswer === 'number' ? q.correctAnswer : 0
                        }));
                        setQuestions(cleanedData);
                    }
                } catch (err) {
                    console.error("Gagal mengambil soal dari Google Sheets:", err);
                }
            };

            const saveGasUrlSetting = (url) => {
                const trimmed = url.trim();
                setGasUrl(trimmed);
                localStorage.setItem('cbt_gas_url', trimmed);
                setShowSettingsModal(false);
                if (trimmed) fetchQuestionsFromGas(trimmed);
            };

            const addViolation = (reason) => {
                if (step !== 'exam') return;

                const now = Date.now();
                if (now - lastViolationTime < 1500) return;
                setLastViolationTime(now);

                const timestamp = new Date().toLocaleTimeString('id-ID');
                const newViolations = [...violations, { time: timestamp, reason }];
                setViolations(newViolations);

                if (newViolations.length >= MAX_VIOLATIONS) {
                    setLockoutReason(`Ujian dihentikan otomatis karena mencapai batas maksimum pelanggaran (${MAX_VIOLATIONS}x).`);
                    submitExam(true, `Mencapai batas ${MAX_VIOLATIONS} pelanggaran security.`);
                } else {
                    setShowViolationModal(true);
                }
            };

            useEffect(() => {
                if (step !== 'exam') return;

                const handleVisibilityChange = () => {
                    if (document.hidden) addViolation("Pindah Tab / Membuka Aplikasi Lain");
                };

                const handleWindowBlur = () => {
                    addViolation("Kursor/Fokus Tinggalkan Layar Ujian");
                };

                const handleFullscreenChange = () => {
                    const isFS = !!document.fullscreenElement;
                    setIsFullscreen(isFS);
                    if (!isFS && step === 'exam') {
                        addViolation("Keluar dari Mode Layar Penuh (Fullscreen)");
                    }
                };

                const handleKeyDown = (e) => {
                    if (
                        e.key === 'F12' ||
                        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                        (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'c' || e.key === 'C' || e.key === 'v' || e.key === 'V' || e.key === 'a' || e.key === 'A' || e.key === 'p' || e.key === 'P')) ||
                        e.key === 'PrintScreen'
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        addViolation(`Percobaan Kombinasi Tombol Terlarang (${e.key})`);
                        return false;
                    }
                };

                const handleContextMenu = (e) => {
                    e.preventDefault();
                    addViolation("Klik Kanan Terdeteksi");
                    return false;
                };

                const handleCopyPaste = (e) => {
                    e.preventDefault();
                    addViolation("Percobaan Salin / Tempel Teks (Copy-Paste)");
                    return false;
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('blur', handleWindowBlur);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                window.addEventListener('keydown', handleKeyDown);
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('copy', handleCopyPaste);
                document.addEventListener('paste', handleCopyPaste);
                document.addEventListener('cut', handleCopyPaste);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('blur', handleWindowBlur);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    window.removeEventListener('keydown', handleKeyDown);
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('copy', handleCopyPaste);
                    document.removeEventListener('paste', handleCopyPaste);
                    document.removeEventListener('cut', handleCopyPaste);
                };
            }, [step, violations, lastViolationTime]);

            useEffect(() => {
                if (step === 'exam') {
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                submitExam(false, "Waktu Ujian telah habis.");
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    if (timerRef.current) clearInterval(timerRef.current);
                }

                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [step]);

            const requestFullscreenMode = () => {
                const element = document.documentElement;
                if (element.requestFullscreen) {
                    element.requestFullscreen().then(() => {
                        setIsFullscreen(true);
                    }).catch(() => {});
                }
            };

            const handleTeacherLogin = () => {
                setTeacherError('');
                if (teacherPass === 'guru123') {
                    setStep('guru_dashboard');
                    if (gasUrl) fetchResultsFromGas();
                } else {
                    setTeacherError("Password Guru salah!");
                }
            };

            const startStudentExam = () => {
                setLoginError('');
                if (!student.name.trim() || !student.nisn.trim()) {
                    setLoginError("Mohon lengkapi Nama Lengkap dan NISN Siswa!");
                    return;
                }

                if (!student.token.trim()) {
                    setLoginError("Mohon masukkan Token Ujian yang diberikan oleh Guru!");
                    return;
                }

                // Match entered token with available subject tokens
                const inputToken = student.token.trim().toUpperCase();
                const matchedMapel = Object.keys(tokens).find(m => tokens[m].toUpperCase() === inputToken);

                if (!matchedMapel) {
                    setLoginError("Token Ujian Tidak Valid! Silakan minta token aktif kepada Guru/Pengawas.");
                    return;
                }

                const mapelQuestions = questions.filter(q => {
                    const matchM = !q.mapel || q.mapel.toLowerCase() === matchedMapel.toLowerCase();
                    const matchK = !q.kelas || q.kelas === 'Semua Kelas' || q.kelas.toLowerCase() === student.kelas.toLowerCase();
                    return matchM && matchK;
                });

                if (mapelQuestions.length === 0) {
                    const mapelOnly = questions.filter(q => !q.mapel || q.mapel.toLowerCase() === matchedMapel.toLowerCase());
                    if (mapelOnly.length === 0) {
                        setLoginError(`Belum ada soal tersedia di bank soal untuk Mata Pelajaran "${matchedMapel}".`);
                        return;
                    }
                }

                setSelectedMapel(matchedMapel);
                setSelectedKelas(student.kelas);
                setStep('instructions');
            };

            const beginTest = () => {
                requestFullscreenMode();
                setStep('exam');
            };

            const submitExam = async (forced = false, reason = '') => {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                setShowSubmitModal(false);
                setShowViolationModal(false);
                setStep('result');

                if (gasUrl) {
                    setIsSubmittingGas(true);
                    const { correct, total, score } = calculateScore();
                    const payload = {
                        action: 'submitExam',
                        name: student.name,
                        nisn: student.nisn,
                        kelas: student.kelas,
                        mapel: selectedMapel,
                        score: score.toFixed(1),
                        correct: correct,
                        total: total,
                        violationsCount: violations.length,
                        violationDetails: violations.map(v => `[${v.time}] ${v.reason}`).join(' | ') || 'Tidak ada pelanggaran',
                        status: reason || (forced ? 'Diskualifikasi / Dihentikan Sistem' : 'Selesai Tepat Waktu')
                    };

                    try {
                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });
                    } catch (e) {
                        console.error("Gagal mengirim data ke Google Sheets", e);
                    } finally {
                        setIsSubmittingGas(false);
                    }
                }
            };

            const getActiveQuestions = () => {
                const mapelQuestions = questions.filter(q => {
                    const matchM = !q.mapel || q.mapel.toLowerCase() === selectedMapel.toLowerCase();
                    const matchK = !q.kelas || q.kelas === 'Semua Kelas' || q.kelas.toLowerCase() === selectedKelas.toLowerCase();
                    return matchM && matchK;
                });
                return mapelQuestions.length > 0 ? mapelQuestions : questions.filter(q => !q.mapel || q.mapel.toLowerCase() === selectedMapel.toLowerCase());
            };

            const calculateScore = () => {
                const activeQ = getActiveQuestions();
                const total = activeQ.length || 1;
                let correct = 0;
                activeQ.forEach((q) => {
                    if (answers[q.id] === q.correctAnswer) {
                        correct++;
                    }
                });
                const score = (correct / total) * 100;
                return { correct, total, score };
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleSaveQuestion = async () => {
                if (!selectedMapelInput) {
                    return;
                }
                if (!selectedKelasInput) {
                    return;
                }
                if (!formQuestion.question.trim()) {
                    return;
                }
                if (formQuestion.options.some(opt => !opt.trim())) {
                    return;
                }

                setIsSavingQuestion(true);

                const newQ = {
                    mapel: selectedMapelInput,
                    kelas: selectedKelasInput,
                    id: questions.length + 1,
                    question: formQuestion.question,
                    options: [...formQuestion.options],
                    correctAnswer: parseInt(formQuestion.correctAnswer)
                };

                setQuestions([...questions, newQ]);

                if (gasUrl) {
                    try {
                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({
                                action: 'addQuestion',
                                ...newQ
                            })
                        });
                    } catch (e) {
                        console.error("Gagal menyimpan ke GS", e);
                    }
                }

                handleResetFormQuestion();
                setIsSavingQuestion(false);
            };

            const handleResetFormQuestion = () => {
                setFormQuestion({
                    question: '',
                    options: ['', '', '', ''],
                    correctAnswer: 0
                });
            };

            const generateNewToken = (mapel) => {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let result = '';
                for (let i = 0; i < 6; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                setTokens({ ...tokens, [mapel]: result });
            };

            const copyToClipboard = (text, mapel) => {
                const dummy = document.createElement("input");
                document.body.appendChild(dummy);
                dummy.value = text;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                setCopiedTokenMapel(mapel);
                setTimeout(() => setCopiedTokenMapel(''), 2000);
            };

            const handleSaveEditQuestion = () => {
                if (!editingQuestion) return;
                if (!editingQuestion.question.trim()) return;
                if (editingQuestion.options.some(opt => !opt.trim())) return;

                setQuestions(prev => prev.map(q => q.id === editingQuestion.id ? editingQuestion : q));
                setEditingQuestion(null);
            };

            const confirmDeleteQuestion = () => {
                if (!deletingQId) return;
                setQuestions(prev => prev.filter(q => q.id !== deletingQId));
                setDeletingQId(null);
            };

            const handleExportCSV = () => {
                const filtered = examResults.filter(res => 
                    (filterKelas === 'ALL' || res.kelas === filterKelas) &&
                    (filterHasilMapel === 'ALL' || (res.mapel && res.mapel.toLowerCase() === filterHasilMapel.toLowerCase()))
                );

                if (filtered.length === 0) return;

                const headers = ["Waktu Selesai", "Nama Siswa", "NISN", "Kelas", "Mata Pelajaran", "Skor", "Jumlah Benar", "Total Soal", "Jumlah Pelanggaran", "Detail Pelanggaran", "Status"];
                
                const rows = filtered.map(r => [
                    `"${r.time || ''}"`,
                    `"${r.name || ''}"`,
                    `"${r.nisn || ''}"`,
                    `"${r.kelas || ''}"`,
                    `"${r.mapel || ''}"`,
                    `"${r.score || 0}"`,
                    `"${r.correct || 0}"`,
                    `"${r.total || 0}"`,
                    `"${r.violationsCount || 0}"`,
                    `"${(r.violationDetails || '').replace(/"/g, '""')}"`,
                    `"${r.status || ''}"`
                ]);

                // UTF-8 BOM untuk memastikan Excel membaca format karakter dengan benar
                const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                const mapelSuffix = filterHasilMapel === 'ALL' ? 'SemuaMapel' : filterHasilMapel.replace(/\s+/g, '_');
                const kelasSuffix = filterKelas === 'ALL' ? 'SemuaKelas' : filterKelas.replace(/\s+/g, '_');
                link.setAttribute("download", `Hasil_Ujian_${mapelSuffix}_${kelasSuffix}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const fetchResultsFromGas = async () => {
                if (!gasUrl) return;
                setIsLoadingResults(true);
                try {
                    const res = await fetch(`${gasUrl}?action=getResults`);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setExamResults(data);
                    }
                } catch (err) {
                    console.error("Gagal menarik hasil ujian:", err);
                } finally {
                    setIsLoadingResults(false);
                }
            };

            if (step === 'login') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden">
                        {/* Background Glow Accents */}
                        <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute bottom-10 right-10 w-80 h-80 bg-violet-600/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div className="w-full max-w-md relative z-10">
                            <div className="glass-panel border border-slate-800 rounded-3xl p-7 sm:p-9 shadow-2xl shadow-indigo-950/40">
                                <div className="text-center mb-8">
                                    <div className="w-20 h-20 bg-slate-900/90 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30 p-2 shadow-lg shadow-indigo-500/10">
                                        <img 
                                            src="https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-" 
                                            alt="Logo SMP Muhammadiyah PKBS Surakarta" 
                                            className="w-full h-full object-contain"
                                            onError={(e) => {
                                                e.target.onerror = null; 
                                                e.target.src = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
                                            }}
                                        />
                                    </div>
                                    <h1 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-indigo-200 tracking-tight">CBT EXAM PORTAL</h1>
                                    <p className="text-indigo-400 font-semibold text-xs mt-1 tracking-wide uppercase">SMP Muhammadiyah PKBS Surakarta</p>
                                </div>

                                <div className="flex bg-slate-900/80 p-1.5 rounded-2xl mb-6 border border-slate-800">
                                    <button
                                        onClick={() => { setRole('siswa'); setLoginError(''); }}
                                        className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-center gap-2 ${role === 'siswa' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        <i className="fas fa-user-graduate text-sm"></i> Portal Siswa
                                    </button>
                                    <button
                                        onClick={() => { setRole('guru'); setTeacherError(''); }}
                                        className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center justify-center gap-2 ${role === 'guru' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        <i className="fas fa-chalkboard-user text-sm"></i> Portal Guru
                                    </button>
                                </div>

                                {role === 'siswa' && (
                                    <div className="space-y-4">
                                        {loginError && (
                                            <div className="bg-red-500/10 border border-red-500/40 rounded-2xl p-3.5 text-xs text-red-300 flex items-start gap-2.5">
                                                <i className="fas fa-circle-exclamation text-red-400 text-sm mt-0.5 shrink-0"></i>
                                                <span className="leading-relaxed">{loginError}</span>
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 mb-1.5">Nama Lengkap Siswa</label>
                                            <div className="relative rounded-2xl bg-slate-900/90 border border-slate-800 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all">
                                                <i className="fas fa-user text-slate-500 absolute left-4 top-1/2 -translate-y-1/2 text-xs"></i>
                                                <input

                                    </p>
                                    <p className="text-[11px] text-slate-400 mb-5">
                                        Pelanggaran ke-<strong>{violations.length}</strong> dari maksimal <strong>{MAX_VIOLATIONS}</strong>x.
                                    </p>
                                    <button
                                        onClick={() => {
                                            setShowViolationModal(false);
                                            requestFullscreenMode();
                                        }}
                                        className="w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl text-xs font-bold transition shadow-lg shadow-red-600/30"
                                    >
                                        SAYA MENGERTI & KEMBALI UJIAN
                                    </button>
                                </div>
                            </div>
                        )}

                        {showSubmitModal && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="glass-panel border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                                    <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/30">
                                        <i className="fas fa-paper-plane text-xl"></i>
                                    </div>
                                    <h3 className="text-base font-bold text-white mb-1">Kumpulkan Jawaban Ujian?</h3>
                                    <p className="text-xs text-slate-400 mb-5">
                                        Terjawab: <strong className="text-emerald-400">{Object.keys(answers).length}</strong> dari {activeQ.length} Soal.
                                    </p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setShowSubmitModal(false)}
                                            className="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold hover:bg-slate-700 transition"
                                        >
                                            Kembali
                                        </button>
                                        <button
                                            onClick={() => submitExam(false, "Selesai Tepat Waktu")}
                                            className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-600/20"
                                        >
                                            Ya, Kumpulkan
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (step === 'result') {
                const { correct, total, score } = calculateScore();
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="w-full max-w-md relative z-10">
                            <div className="glass-panel border border-slate-800 rounded-3xl p-7 sm:p-9 text-center shadow-2xl">
                                <div className="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/30 p-2">
                                    <img 
                                        src="https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-" 
                                        alt="Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
                                        }}
                                    />
                                </div>
                                <h2 className="text-xl font-black text-white">Ujian Telah Selesai</h2>
                                <p className="text-xs text-indigo-400 font-bold mt-0.5 uppercase tracking-wide">SMP Muhammadiyah PKBS Surakarta</p>
                                <p className="text-xs text-slate-400 mt-1 mb-6">{selectedMapel} - {student.name}</p>

                                <div className="bg-slate-950/80 p-6 rounded-2xl border border-slate-800 mb-6">
                                    <span className="text-xs text-slate-500 uppercase tracking-wider block font-bold">Skor Akhir Siswa</span>
                                    <span className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-violet-400 my-2 block">{score.toFixed(0)}</span>
                                    <span className="text-xs text-slate-400">Jawaban Benar: <strong className="text-white">{correct}</strong> dari {total} soal</span>
                                </div>

                                <button
                                    onClick={() => window.location.reload()}
                                    className="w-full py-3.5 bg-gradient-to-r from-indigo-600 hover:from-indigo-500 to-violet-600 hover:to-violet-500 text-white rounded-2xl font-bold text-xs sm:text-sm shadow-xl shadow-indigo-600/30 transition"
                                >
                                    Selesai & Kembali ke Login
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
