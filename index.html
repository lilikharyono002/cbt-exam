                                                <label className={`block text-xs ${t.label}`}>Daftar Pasangan Menjodohkan</label>
                                                <button type="button" onClick={() => setEditingQuestion({ ...editingQuestion, pairs: [...(editingQuestion.pairs || []), { left: '', right: '' }] })} className="px-2.5 py-1 bg-indigo-600/10 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-600/20 rounded-lg text-[11px] font-bold border border-indigo-500/30 transition">
                                                    + Tambah Pasangan
                                                </button>
                                            </div>
                                            {(editingQuestion.pairs || []).map((pair, pIdx) => (
                                                <div key={pIdx} className={`flex items-center gap-2 ${t.cardInner} p-2.5 rounded-xl`}>
                                                    <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400 w-4">{pIdx + 1}.</span>
                                                    <input type="text" placeholder="Pernyataan Kiri..." className={`flex-1 min-w-0 ${t.input} rounded-lg px-2.5 py-1.5 text-xs`} value={pair.left || ''} onChange={(e) => updateEditPair(pIdx, 'left', e.target.value)} />
                                                    <i className="fas fa-arrow-right text-slate-400 text-xs"></i>
                                                    <input type="text" placeholder="Pasangan Kanan..." className={`flex-1 min-w-0 ${t.input} rounded-lg px-2.5 py-1.5 text-xs`} value={pair.right || ''} onChange={(e) => updateEditPair(pIdx, 'right', e.target.value)} />
                                                    {(editingQuestion.pairs || []).length > 2 && (
                                                        <button type="button" onClick={() => setEditingQuestion({ ...editingQuestion, pairs: editingQuestion.pairs.filter((_, idx) => idx !== pIdx) })} className="text-red-500 hover:text-red-600 p-1">
                                                            <i className="fas fa-trash-can text-xs"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {editingQuestion.type === 'benar_salah' && (
                                        <div className={`space-y-2 ${t.cardInner} p-3 rounded-xl`}>
                                            <label className={`block text-xs ${t.label} mb-1`}>Kunci Jawaban Benar / Salah:</label>
                                            <div className="flex gap-3">
                                                {['BENAR', 'SALAH'].map(v => (
                                                    <label key={v} className={`flex-1 p-2.5 rounded-xl border cursor-pointer flex items-center justify-center gap-2 text-xs font-bold transition ${editingQuestion.correctAnswer === v ? (v === 'BENAR' ? 'bg-emerald-500/10 border-emerald-500 text-emerald-700 dark:text-emerald-300' : 'bg-red-500/10 border-red-500 text-red-700 dark:text-red-300') : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-800 text-slate-400'}`}>
                                                        <input type="radio" name="editTfAnswer" checked={editingQuestion.correctAnswer === v} onChange={() => setEditingQuestion({ ...editingQuestion, correctAnswer: v })} className={v === 'BENAR' ? 'accent-emerald-500' : 'accent-red-500'} />
                                                        <span>{v}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {editingQuestion.type === 'uraian' && (
                                        <div className="bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-500/30 p-3 rounded-xl text-xs text-indigo-700 dark:text-indigo-300 italic">
                                            <i className="fas fa-file-pen mr-1"></i> Soal Uraian - Dikerjakan di Lembar Kertas Sekolah.
                                        </div>
                                    )}

                                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                                        <button onClick={() => setEditingQuestion(null)} className={`px-4 py-2 rounded-xl text-xs transition ${t.btnSecondary}`}>Batal</button>
                                        <button onClick={handleSaveEditQuestion} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/30">Simpan Perubahan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Hapus Soal */}
                        {deletingQId !== null && (
                            <div className={`fixed inset-0 ${t.modalBg} z-50 flex items-center justify-center p-4`}>
                                <div className={`${t.modalContent} rounded-3xl p-6 max-w-sm w-full text-center space-y-4`}>
                                    <div className="w-12 h-12 bg-red-500/10 text-red-600 dark:text-red-400 rounded-2xl flex items-center justify-center mx-auto border border-red-500/30">
                                        <i className="fas fa-trash-can text-xl"></i>
                                    </div>
                                    <h3 className={`text-base font-bold ${t.title}`}>Konfirmasi Hapus</h3>
                                    <p className={`text-xs ${t.sub}`}>Apakah Anda yakin ingin menghapus soal ini dari bank soal?</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setDeletingQId(null)} className={`flex-1 py-2.5 rounded-xl text-xs transition ${t.btnSecondary}`}>Batal</button>
                                        <button onClick={confirmDeleteQuestion} className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition">Ya, Hapus</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Preview Soal */}
                        {showPreviewModal && (
                            <div className={`fixed inset-0 ${t.modalBg} z-50 flex items-center justify-center p-4`}>
                                <div className={`${t.modalContent} rounded-3xl p-6 max-w-4xl w-full h-[90vh] flex flex-col`}>
                                    <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4 shrink-0">
                                        <div className="flex items-center gap-2.5">
                                            <div className="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-600/20 border border-indigo-200 dark:border-indigo-500/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                                                <i className="fas fa-eye text-sm"></i>
                                            </div>
                                            <div>
                                                <h3 className={`text-sm font-bold ${t.title}`}>Pratinjau Tampilan Ujian Siswa</h3>
                                                <p className="text-[11px] text-indigo-600 dark:text-indigo-400 font-medium">{selectedTeacherMapel} ({filterDaftarKelas === 'ALL' ? 'Semua Kelas' : filterDaftarKelas})</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setShowPreviewModal(false)} className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm transition ${t.btnSecondary}`}>
                                            <i className="fas fa-xmark"></i>
                                        </button>
                                    </div>

                                    {bankQuestions.length === 0 ? (
                                        <div className={`flex-1 flex flex-col items-center justify-center text-center p-6 ${t.sub} text-xs`}>
                                            <i className="fas fa-folder-open text-3xl mb-2"></i>
                                            <p>Belum ada soal untuk mata pelajaran dan kelas ini.</p>
                                        </div>
                                    ) : (() => {
                                        const idx = Math.min(previewQIndex, bankQuestions.length - 1);
                                        const cq = bankQuestions[idx];
                                        return (
                                            <div className="flex-1 flex flex-col md:flex-row gap-4 overflow-hidden">
                                                <div className={`flex-1 ${t.cardInner} rounded-2xl p-5 overflow-y-auto flex flex-col justify-between`}>
                                                    <div>
                                                        <div className="flex items-center justify-between mb-4 border-b border-slate-200 dark:border-slate-800 pb-2.5">
                                                            <span className="text-xs font-bold text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/80 px-3 py-1 rounded-lg border border-indigo-200 dark:border-indigo-500/30">Soal {idx + 1} dari {bankQuestions.length}</span>
                                                            <span className="text-[10px] font-bold text-violet-700 dark:text-violet-300 bg-violet-50 dark:bg-violet-950/80 px-2.5 py-1 rounded-lg border border-violet-200 dark:border-violet-500/30 uppercase">{TYPE_LABELS[cq.type || 'pilihan_ganda']}</span>
                                                        </div>
                                                        <p className={`text-sm font-semibold ${t.title} mb-4 leading-relaxed`}>{cq.question}</p>
                                                        {cq.imageUrl && (
                                                            <div className="mb-4 max-w-md mx-auto text-center bg-white dark:bg-slate-950 p-2 rounded-xl border border-slate-200 dark:border-slate-800">
                                                                <img src={formatImageUrl(cq.imageUrl)} alt="Preview Soal" className="zoomable max-h-48 w-full object-contain rounded-lg cursor-pointer" onClick={() => setZoomedImage(formatImageUrl(cq.imageUrl))} onError={(e) => { e.target.style.display = 'none'; }} />
                                                            </div>
                                                        )}
                                                        {cq.type === 'pilihan_ganda' && (
                                                            <div className="space-y-2">
                                                                {(cq.options || []).map((opt, optIdx) => (
                                                                    <div key={optIdx} className={`p-3 rounded-xl border text-xs flex items-center gap-3 ${cq.correctAnswer === optIdx ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-400 dark:border-emerald-500/60 text-emerald-800 dark:text-emerald-300 font-semibold' : 'bg-white dark:bg-slate-950/60 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300'}`}>
                                                                        <span className={`w-6 h-6 rounded-lg flex items-center justify-center font-bold text-[11px] ${cq.correctAnswer === optIdx ? 'bg-emerald-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-400'}`}>{String.fromCharCode(65 + optIdx)}</span>
                                                                        <span className="flex-1">{opt}</span>
                                                                        {cq.correctAnswer === optIdx && <span className="text-[10px] bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded font-bold">Kunci Jawaban</span>}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                        {cq.type === 'menjodohkan' && (
                                                            <div className="space-y-2">
                                                                {(cq.pairs || []).map((pair, pIdx) => (
                                                                    <div key={pIdx} className="p-3 bg-white dark:bg-slate-950/80 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs gap-2">
                                                                        <span className={`font-semibold ${t.title} flex items-center gap-2`}>
                                                                            <span className="w-5 h-5 rounded bg-indigo-600/20 text-indigo-600 dark:text-indigo-300 text-[10px] font-bold flex items-center justify-center">{pIdx + 1}</span>
                                                                            {pair.left}
                                                                        </span>
                                                                        <i className="fas fa-arrow-right text-indigo-500 text-xs"></i>
                                                                        <span className="font-bold text-emerald-600 dark:text-emerald-300 bg-slate-50 dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800">{pair.right}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                        {cq.type === 'benar_salah' && (
                                                            <div className="grid grid-cols-2 gap-3">
                                                                <div className={`p-4 rounded-xl border text-center text-xs font-bold ${cq.correctAnswer === 'BENAR' ? 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-400 dark:border-emerald-500 text-emerald-800 dark:text-emerald-300' : 'bg-white dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-400'}`}>BENAR {cq.correctAnswer === 'BENAR' && '(Kunci)'}</div>
                                                                <div className={`p-4 rounded-xl border text-center text-xs font-bold ${cq.correctAnswer === 'SALAH' ? 'bg-red-50 dark:bg-red-950/60 border-red-400 dark:border-red-500 text-red-800 dark:text-red-300' : 'bg-white dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-400'}`}>SALAH {cq.correctAnswer === 'SALAH' && '(Kunci)'}</div>
                                                            </div>
                                                        )}
                                                        {cq.type === 'uraian' && (
                                                            <div className="p-3 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-xl text-xs text-amber-800 dark:text-amber-200">
                                                                <i className="fas fa-pen-nib mr-1 text-amber-500"></i> Dikerjakan di lembar kertas ujian sekolah.
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex justify-between items-center gap-2 pt-3 mt-4 border-t border-slate-200 dark:border-slate-800 shrink-0">
                                                        <button disabled={idx === 0} onClick={() => setPreviewQIndex(idx - 1)} className={`px-3.5 py-2 disabled:opacity-30 rounded-xl text-xs font-semibold transition ${t.btnSecondary}`}>
                                                            <i className="fas fa-chevron-left mr-1"></i> Prev
                                                        </button>
                                                        <span className={`text-xs ${t.sub} font-medium`}>{idx + 1} / {bankQuestions.length}</span>
                                                        <button disabled={idx === bankQuestions.length - 1} onClick={() => setPreviewQIndex(idx + 1)} className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 text-white rounded-xl text-xs font-semibold transition">
                                                            Next <i className="fas fa-chevron-right ml-1"></i>
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className={`w-full md:w-48 ${t.cardInner} rounded-2xl p-3 flex flex-col shrink-0`}>
                                                    <span className={`text-[11px] font-bold ${t.sub} mb-2 border-b border-slate-200 dark:border-slate-800 pb-1.5`}>Pilih Nomor Soal</span>
                                                    <div className="grid grid-cols-5 md:grid-cols-4 gap-1.5 overflow-y-auto max-h-60 md:max-h-none">
                                                        {bankQuestions.map((q, qIdx) => (
                                                            <button key={qIdx} onClick={() => setPreviewQIndex(qIdx)} className={`h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border ${idx === qIdx ? 'bg-indigo-600 text-white border-indigo-500 shadow-md' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:text-indigo-600'}`}>
                                                                {qIdx + 1}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // =====================================================
            // LAYAR 3: PETUNJUK SISWA
            // =====================================================
            if (step === 'instructions') {
                return withModals(
                    <div className={`min-h-screen ${t.bg} flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-300`}>
                        <div className="w-full max-w-lg relative z-10">
                            <div className={`${t.card} rounded-3xl p-7 sm:p-9 shadow-2xl`}>
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/30 p-2">
                                        <Logo className="w-full h-full object-contain" />
                                    </div>
                                    <h2 className={`text-xl font-black ${t.title}`}>Petunjuk & Aturan Ujian</h2>
                                    <p className="text-xs text-indigo-600 dark:text-indigo-400 font-bold mt-0.5 uppercase tracking-wide">SMP Muhammadiyah PKBS Surakarta</p>
                                    <div className="inline-block mt-2 px-3 py-1 bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-200 dark:border-indigo-500/30 text-indigo-700 dark:text-indigo-300 font-bold rounded-xl text-xs">
                                        {selectedMapel} - {student.kelas}
                                    </div>
                                </div>

                                <div className={`${t.cardInner} p-4 rounded-2xl space-y-2.5 mb-6 text-xs`}>
                                    <div className="flex justify-between border-b border-slate-200 dark:border-slate-800/80 pb-2">
                                        <span className={t.sub}>Nama Peserta:</span>
                                        <span className={`font-bold ${t.title}`}>{student.name}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-200 dark:border-slate-800/80 pb-2">
                                        <span className={t.sub}>NISN:</span>
                                        <span className={`font-bold ${t.title} font-mono`}>{student.nisn}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-200 dark:border-slate-800/80 pb-2">
                                        <span className={t.sub}>Durasi Pengerjaan:</span>
                                        <span className="font-bold text-amber-600 dark:text-amber-400">{examDuration} Menit</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className={t.sub}>Batas Toleransi Pelanggaran:</span>
                                        <span className="font-bold text-red-600 dark:text-red-400">Maksimal {MAX_VIOLATIONS} Kali</span>
                                    </div>
                                </div>

                                <div className="bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-2xl p-4 mb-6 text-xs text-amber-800 dark:text-amber-200 space-y-1.5">
                                    <div className="font-bold flex items-center gap-2 mb-1 text-amber-600 dark:text-amber-400">
                                        <i className="fas fa-triangle-exclamation text-sm"></i> ATURAN PENTING & KEAMANAN UJIAN:
                                    </div>
                                    <p>1. Ujian berjalan dalam mode <strong>Layar Penuh (Fullscreen)</strong>.</p>
                                    <p>2. Dilarang berpindah tab, berpindah aplikasi, meminimize window, atau menekan tombol F12 / PrintScreen / Copy-Paste.</p>
                                    <p>3. Soal dikerjakan berurutan per jenis. Setiap pindah jenis soal ada jeda membaca petunjuk {TRANSITION_SECONDS} detik.</p>
                                    <p>4. Soal Uraian baru terbuka setelah <strong>55%</strong> waktu ujian berjalan.</p>
                                    <p>5. Jika melakukan pelanggaran sebanyak {MAX_VIOLATIONS}x, sistem akan <strong>OTOMATIS MENGHENTIKAN UJIAN & MENDISKUALIFIKASI</strong>.</p>
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={handleLogout} className={`py-3.5 px-4 rounded-2xl font-bold text-xs transition ${t.btnSecondary}`}>Batal</button>
                                    <button onClick={beginTest} className="flex-1 py-3.5 bg-gradient-to-r from-indigo-600 hover:from-indigo-500 to-violet-600 hover:to-violet-500 text-white rounded-2xl font-bold text-xs sm:text-sm shadow-xl shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                                        <i className="fas fa-play"></i>
                                        <span>Saya Mengerti & Mulai Pengerjaan</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // =====================================================
            // LAYAR 4: RUANG UJIAN SISWA
            // =====================================================
            if (step === 'exam') {
                const activeQ = getActiveQuestions();
                const safeIndex = Math.min(currentQIndex, Math.max(0, activeQ.length - 1));
                const currentQ = activeQ[safeIndex];

                const totalDurSec = examDuration * 60;
                const elapsedSec = totalDurSec - timeLeft;
                const uraianOpen = elapsedSec >= totalDurSec * URAIAN_UNLOCK_RATIO;
                const answeredCount = activeQ.filter(q => isAnsweredQ(q, answers[q.id])).length;

                if (!currentQ) {
                    return withModals(
                        <div className={`min-h-screen ${t.bg} flex items-center justify-center p-6 text-center`}>
                            <div className={`${t.card} rounded-3xl p-6 max-w-sm`}>
                                <p className={`text-sm ${t.title} font-bold mb-3`}>Tidak ada soal yang tersedia.</p>
                                <button onClick={handleLogout} className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">Kembali</button>
                            </div>
                        </div>
                    );
                }

                const qType = currentQ.type || 'pilihan_ganda';
                const currentAns = answers[currentQ.id];

                return withModals(
                    <div className={`min-h-screen ${t.bg} flex flex-col transition-colors duration-300`}>
                        <header className={`${t.header} px-4 py-3 sticky top-0 z-30 flex flex-wrap items-center justify-between gap-2 transition-colors duration-300`}>
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center border border-indigo-500/30 p-1">
                                    <Logo className="w-full h-full object-contain" />
                                </div>
                                <div>
                                    <h1 className={`text-xs sm:text-sm font-bold ${t.title} line-clamp-1`}>{selectedMapel}</h1>
                                    <p className="text-[10px] text-indigo-600 dark:text-indigo-400 font-medium">{student.name} ({student.kelas})</p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                                <div className={`px-2.5 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 ${violations.length > 0 ? 'bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/30' : t.btnSecondary}`}>
                                    <i className="fas fa-shield-halved"></i>
                                    <span>Pelanggaran: {violations.length}/{MAX_VIOLATIONS}</span>
                                </div>
                                <div className={`px-3 py-1 rounded-xl font-mono text-xs sm:text-sm font-extrabold flex items-center gap-2 ${timeLeft < 180 ? 'bg-red-600 text-white animate-pulse shadow-lg shadow-red-600/40' : `${t.btnSecondary} text-amber-600 dark:text-amber-400`}`}>
                                    <i className="fas fa-clock"></i>
                                    <span>{formatTime(timeLeft)}</span>
                                </div>
                                <button onClick={() => setShowSubmitModal(true)} className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20">
                                    Selesai Ujian
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
                            {/* Area soal */}
                            <div className={`flex-1 min-w-0 ${t.card} rounded-3xl p-5 sm:p-6 flex flex-col`}>
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-4 border-b border-slate-200 dark:border-slate-800/80 pb-3">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/80 px-3 py-1 rounded-lg border border-indigo-200 dark:border-indigo-500/30">
                                            Soal {safeIndex + 1} dari {activeQ.length}
                                        </span>
                                        <span className="text-[10px] font-bold text-violet-700 dark:text-violet-300 bg-violet-50 dark:bg-violet-950/80 px-2.5 py-1 rounded-lg border border-violet-200 dark:border-violet-500/30 uppercase">
                                            {TYPE_LABELS[qType]}
                                        </span>
                                    </div>
                                    <button
                                        onClick={() => toggleFlag(currentQ.id)}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${flagged[currentQ.id] ? 'bg-amber-500 text-slate-950 border-amber-400' : `${t.btnSecondary}`}`}
                                    >
                                        <i className="fas fa-flag"></i>
                                        <span>{flagged[currentQ.id] ? 'Ragu-ragu (aktif)' : 'Tandai Ragu-ragu'}</span>
                                    </button>
                                </div>

                                <div className="flex-1">
                                    <p className={`text-sm sm:text-base font-semibold ${t.title} mb-4 leading-relaxed whitespace-pre-wrap`}>{currentQ.question}</p>

                                    {currentQ.imageUrl && (
                                        <div className="mb-4 max-w-md bg-white dark:bg-slate-950 p-2 rounded-xl border border-slate-200 dark:border-slate-800">
                                            <img
                                                src={formatImageUrl(currentQ.imageUrl)}
                                                alt="Gambar Soal"
                                                className="zoomable max-h-60 w-full object-contain rounded-lg cursor-zoom-in"
                                                onClick={() => setZoomedImage(formatImageUrl(currentQ.imageUrl))}
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />
                                            <p className={`text-[10px] ${t.sub} text-center mt-1`}>Klik gambar untuk memperbesar</p>
                                        </div>
                                    )}

                                    {qType === 'pilihan_ganda' && (
                                        <div className="space-y-2.5">
                                            {(currentQ.options || []).map((opt, optIdx) => {
                                                const selected = currentAns === optIdx;
                                                return (
                                                    <button
                                                        key={optIdx}
                                                        onClick={() => setAnswer(currentQ.id, optIdx)}
                                                        className={`w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm flex items-center gap-3 transition ${selected ? 'bg-indigo-600/10 border-indigo-500 text-indigo-700 dark:text-indigo-200 font-semibold ring-1 ring-indigo-500/40' : t.option}`}
                                                    >
                                                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${selected ? 'bg-indigo-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`}>
                                                            {String.fromCharCode(65 + optIdx)}
                                                        </span>
                                                        <span className="flex-1">{opt}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {qType === 'menjodohkan' && (() => {
                                        const rightOptions = shuffleSeeded((currentQ.pairs || []).map(p => p.right), currentQ.id);
                                        const cur = (typeof currentAns === 'object' && currentAns) || {};
                                        return (
                                            <div className="space-y-2.5">
                                                {(currentQ.pairs || []).map((p, pIdx) => (
                                                    <div key={pIdx} className={`p-3 rounded-2xl border flex flex-col sm:flex-row sm:items-center gap-2 ${t.option}`}>
                                                        <span className="flex items-center gap-2 flex-1 text-xs sm:text-sm font-semibold">
                                                            <span className="w-6 h-6 rounded-lg bg-indigo-600/20 text-indigo-600 dark:text-indigo-300 text-[11px] font-bold flex items-center justify-center shrink-0">{pIdx + 1}</span>
                                                            <span>{p.left}</span>
                                                        </span>
                                                        <i className="fas fa-arrow-right text-indigo-500 text-xs hidden sm:block"></i>
                                                        <select
                                                            className={`sm:w-64 ${t.select} rounded-xl px-3 py-2 text-xs cursor-pointer`}
                                                            value={cur[pIdx] || ''}
                                                            onChange={(e) => setMatchAnswer(currentQ, pIdx, e.target.value)}
                                                        >
                                                            <option value="" className={t.optBg}>-- Pilih pasangan --</option>
                                                            {rightOptions.map((r, rIdx) => (
                                                                <option key={rIdx} value={r} className={t.optBg}>{r}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    })()}

                                    {qType === 'benar_salah' && (
                                        <div className="grid grid-cols-2 gap-3">
                                            {['BENAR', 'SALAH'].map(v => {
                                                const selected = currentAns === v;
                                                const base = v === 'BENAR'
                                                    ? 'bg-emerald-500/10 border-emerald-500 text-emerald-700 dark:text-emerald-300 ring-1 ring-emerald-500/40'
                                                    : 'bg-red-500/10 border-red-500 text-red-700 dark:text-red-300 ring-1 ring-red-500/40';
                                                return (
                                                    <button
                                                        key={v}
                                                        onClick={() => setAnswer(currentQ.id, v)}
                                                        className={`p-4 rounded-2xl border text-sm font-bold transition flex items-center justify-center gap-2 ${selected ? base : t.option}`}
                                                    >
                                                        <i className={`fas ${v === 'BENAR' ? 'fa-circle-check' : 'fa-circle-xmark'}`}></i>
                                                        <span>{v}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {qType === 'uraian' && (
                                        <div className="space-y-3">
                                            <div className="p-4 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-2xl text-xs text-amber-800 dark:text-amber-200 leading-relaxed">
                                                <i className="fas fa-pen-nib mr-1.5 text-amber-500"></i>
                                                Kerjakan soal ini secara tertulis pada <strong>lembar kertas ujian</strong> dari pengawas. Tulis nomor soal dan jawaban dengan rapi.
                                            </div>
                                            <button
                                                onClick={() => {
                                                    if (isAnsweredQ(currentQ, currentAns)) {
                                                        setAnswers(prev => { const n = { ...prev }; delete n[currentQ.id]; return n; });
                                                    } else {
                                                        setAnswer(currentQ.id, 'ditulis');
                                                    }
                                                }}
                                                className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 border ${isAnsweredQ(currentQ, currentAns) ? 'bg-emerald-600 text-white border-emerald-500' : t.btnSecondary}`}
                                            >
                                                <i className={`fas ${isAnsweredQ(currentQ, currentAns) ? 'fa-square-check' : 'fa-square'}`}></i>
                                                <span>{isAnsweredQ(currentQ, currentAns) ? 'Sudah Ditulis di Kertas' : 'Tandai Sudah Ditulis di Kertas'}</span>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="flex justify-between items-center gap-3 mt-8 pt-4 border-t border-slate-200 dark:border-slate-800/80">
                                    <button
                                        disabled={safeIndex === 0}
                                        onClick={() => navigateToQuestion(safeIndex - 1)}
                                        className={`px-4 py-2.5 disabled:opacity-30 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 ${t.btnSecondary}`}
                                    >
                                        <i className="fas fa-chevron-left"></i><span>Sebelumnya</span>
                                    </button>

                                    {safeIndex === activeQ.length - 1 ? (
                                        <button onClick={() => setShowSubmitModal(true)} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/25">
                                            <span>Kumpulkan</span><i className="fas fa-paper-plane"></i>
                                        </button>
                                    ) : (
                                        <button onClick={() => navigateToQuestion(safeIndex + 1)} className="px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/25">
                                            <span>Selanjutnya</span><i className="fas fa-chevron-right"></i>
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Navigasi soal */}
                            <div className={`w-full md:w-64 ${t.sidebar} rounded-3xl p-4 h-fit backdrop-blur-md shadow-xl`}>
                                <h3 className={`text-xs font-bold ${t.label} mb-3 border-b border-slate-200 dark:border-slate-800/80 pb-2 flex items-center gap-2`}>
                                    <i className="fas fa-th-large text-indigo-400"></i>
                                    <span>Navigasi Soal</span>
                                </h3>
                                <div className="grid grid-cols-5 gap-2">
                                    {activeQ.map((q, idx) => {
                                        const type = q.type || 'pilihan_ganda';
                                        const answered = isAnsweredQ(q, answers[q.id]);
                                        const isFlag = flagged[q.id];
                                        const isCurrent = safeIndex === idx;
                                        const locked = !unlockedTypes[type] || (type === 'uraian' && !uraianOpen);

                                        let cls = theme === 'light' ? 'bg-slate-50 text-slate-600 border-slate-300' : 'bg-slate-950/80 text-slate-400 border-slate-800';
                                        if (isCurrent) cls = 'ring-2 ring-indigo-500 bg-indigo-600 text-white font-bold border-indigo-500';
                                        else if (isFlag) cls = 'bg-amber-500 text-slate-950 font-bold border-amber-400';
                                        else if (answered) cls = 'bg-emerald-600 text-white font-semibold border-emerald-500';
                                        else if (locked) cls = theme === 'light' ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-slate-950/50 text-slate-600 border-slate-900';

                                        return (
                                            <button key={q.id || idx} onClick={() => navigateToQuestion(idx)} className={`h-9 rounded-xl text-xs border transition flex items-center justify-center relative ${cls}`}>
                                                {locked && !isCurrent ? <i className="fas fa-lock text-[10px] text-amber-500/80"></i> : idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div className={`mt-4 pt-3 border-t border-slate-200 dark:border-slate-800/80 space-y-1.5 text-[10px] ${t.sub}`}>
                                    <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-emerald-600"></span> Sudah dijawab ({answeredCount}/{activeQ.length})</div>
                                    <div className="flex items-center gap-2"><span className="w-3 h-3 rounded bg-amber-500"></span> Ragu-ragu</div>
                                    <div className="flex items-center gap-2"><i className="fas fa-lock text-amber-500/80 w-3 text-center"></i> Terkunci / belum dibuka</div>
                                </div>
                            </div>
                        </div>

                        {/* Jeda pindah jenis soal */}
                        {pendingTransition && (
                            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="glass-panel border border-indigo-500/50 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl space-y-4 text-slate-100">
                                    <div className="w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto border border-indigo-500/40 shadow-lg">
                                        <i className="fas fa-book-open-reader text-2xl"></i>
                                    </div>
                                    <div>
                                        <span className="text-[10px] font-extrabold uppercase text-indigo-400 tracking-wider">Pindah Jenis Soal</span>
                                        <h3 className="text-base font-black text-white mt-0.5">Petunjuk Soal {TYPE_LABELS[pendingTransition.targetType]}</h3>
                                    </div>
                                    <div className="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl text-left text-xs text-slate-300 space-y-2">
                                        <div className="font-bold text-white border-b border-slate-800 pb-1.5 flex items-center gap-1.5">
                                            <i className="fas fa-circle-info text-indigo-400"></i> Cara Mengerjakan:
                                        </div>
                                        {pendingTransition.targetType === 'pilihan_ganda' && <p>Pilihlah <strong>satu jawaban paling tepat</strong> dari opsi yang tersedia di layar.</p>}
                                        {pendingTransition.targetType === 'menjodohkan' && <p>Pasangkanlah setiap <strong>pernyataan di kolom kiri</strong> dengan <strong>opsi jawaban yang tepat</strong> melalui menu pilihan.</p>}
                                        {pendingTransition.targetType === 'benar_salah' && <p>Tentukan apakah pernyataan yang disajikan bernilai <strong>BENAR</strong> atau <strong>SALAH</strong> dengan menekan tombol pilihan.</p>}
                                        {pendingTransition.targetType === 'uraian' && <p>Soal Uraian dikerjakan secara tertulis pada <strong>lembar kertas ujian</strong> yang disediakan pengawas. Tuliskan nomor soal dan jawaban Anda dengan rapi.</p>}
                                        <p className="text-[11px] text-amber-300/90 pt-1 italic border-t border-slate-800/80">* Bacalah petunjuk dengan teliti. Tombol akan aktif setelah hitungan mundur selesai.</p>
                                    </div>
                                    <div className="bg-indigo-950/60 border border-indigo-500/30 p-3 rounded-2xl flex items-center justify-center gap-2 font-mono text-xs">
                                        <span className="text-slate-400">Soal Terbuka Dalam:</span>
                                        <span className="text-amber-400 font-extrabold text-sm">00:{transitionTimer.toString().padStart(2, '0')}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setPendingTransition(null)} className="px-4 py-3.5 rounded-2xl font-bold text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                                            Batal
                                        </button>
                                        <button
                                            disabled={transitionTimer > 0}
                                            onClick={() => {
                                                setUnlockedTypes(prev => ({ ...prev, [pendingTransition.targetType]: true }));
                                                setCurrentQIndex(pendingTransition.targetIndex);
                                                setPendingTransition(null);
                                            }}
                                            className={`flex-1 py-3.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 ${transitionTimer > 0 ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700' : 'bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-xl shadow-emerald-600/30'}`}
                                        >
                                            {transitionTimer > 0 ? (
                                                <React.Fragment><i className="fas fa-lock text-xs"></i><span>Mohon Membaca Petunjuk</span></React.Fragment>
                                            ) : (
                                                <React.Fragment><i className="fas fa-unlock text-xs"></i><span>Mulai Kerjakan</span></React.Fragment>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Kunci uraian 55% */}
                        {showUraianLockModal && (() => {
                            const totalDurMin = examDuration;
                            const requiredSec = Math.ceil(totalDurMin * 60 * URAIAN_UNLOCK_RATIO);
                            const remainingSec = Math.max(0, requiredSec - elapsedSec);
                            return (
                                <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                    <div className="glass-panel border border-amber-500/50 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4 text-slate-100">
                                        <div className="w-14 h-14 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto border border-amber-500/40 shadow-lg">
                                            <i className="fas fa-lock text-2xl"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-base font-black text-white">Soal Uraian Masih Terkunci</h3>
                                            <p className="text-xs text-amber-300 font-semibold mt-1">Syarat 55% Waktu Ujian Belum Terpenuhi</p>
                                        </div>
                                        <div className="bg-slate-950/80 border border-slate-800 p-4 rounded-2xl text-xs text-slate-300 text-left space-y-2">
                                            <div className="flex justify-between border-b border-slate-800 pb-1.5"><span className="text-slate-400">Total Durasi Ujian:</span><span className="font-bold text-white">{totalDurMin} Menit</span></div>
                                            <div className="flex justify-between border-b border-slate-800 pb-1.5"><span className="text-slate-400">Syarat Buka Uraian (55%):</span><span className="font-bold text-amber-400">Setelah {Math.ceil(requiredSec / 60)} Menit</span></div>
                                            <div className="flex justify-between border-b border-slate-800 pb-1.5"><span className="text-slate-400">Waktu Tes Berjalan:</span><span className="font-bold text-indigo-300">{Math.floor(elapsedSec / 60)}m {elapsedSec % 60}s</span></div>
                                            <div className="flex justify-between pt-0.5"><span className="text-slate-400">Sisa Waktu Tunggu:</span><span className="font-bold text-red-400">{Math.floor(remainingSec / 60)}m {remainingSec % 60}s lagi</span></div>
                                        </div>
                                        <button onClick={() => setShowUraianLockModal(false)} className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-xs font-bold transition shadow-lg shadow-indigo-600/30">
                                            Mengerti, Periksa Kembali Soal Lain
                                        </button>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* Peringatan pelanggaran */}
                        {showViolationModal && (
                            <div className={`fixed inset-0 ${t.modalBg} z-50 flex items-center justify-center p-4`}>
                                <div className={`${t.modalContent} border-red-500/50 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl`}>
                                    <div className="w-14 h-14 bg-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-red-500/40">
                                        <i className="fas fa-triangle-exclamation text-2xl"></i>
                                    </div>
                                    <h3 className={`text-base font-black ${t.title} mb-1`}>PERINGATAN PELANGGARAN!</h3>
                                    <p className="text-xs text-red-600 dark:text-red-400 font-semibold mb-3">{violations[violations.length - 1]?.reason || "Tindakan terlarang terdeteksi!"}</p>
                                    <p className={`text-[11px] ${t.sub} mb-5`}>Pelanggaran ke-<strong>{violations.length}</strong> dari maksimal <strong>{MAX_VIOLATIONS}</strong>x.</p>
                                    <button
                                        onClick={() => { setShowViolationModal(false); requestFullscreenMode(); }}
                                        className="w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl text-xs font-bold transition shadow-lg shadow-red-600/30"
                                    >
                                        SAYA MENGERTI & KEMBALI UJIAN
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Konfirmasi kumpulkan */}
                        {showSubmitModal && (
                            <div className={`fixed inset-0 ${t.modalBg} z-50 flex items-center justify-center p-4`}>
                                <div className={`${t.modalContent} rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl`}>
                                    <div className="w-12 h-12 bg-emerald-500/20 text-emerald-500 dark:text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/30">
                                        <i className="fas fa-paper-plane text-xl"></i>
                                    </div>
                                    <h3 className={`text-base font-bold ${t.title} mb-1`}>Kumpulkan Jawaban Ujian?</h3>
                                    <p className={`text-xs ${t.sub} mb-5`}>
                                        Terjawab: <strong className="text-emerald-600 dark:text-emerald-400">{answeredCount}</strong> dari {activeQ.length} Soal.
                                    </p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowSubmitModal(false)} className={`flex-1 py-2.5 rounded-xl text-xs font-semibold transition ${t.btnSecondary}`}>Kembali</button>
                                        <button onClick={() => submitExam(false, "Selesai Tepat Waktu")} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-600/20">Ya, Kumpulkan</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // =====================================================
            // LAYAR 5: HASIL
            // =====================================================
            if (step === 'result') {
                const { correct, total, score } = result;
                return withModals(
                    <div className={`min-h-screen ${t.bg} flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-300`}>
                        <div className="w-full max-w-md relative z-10">
                            <div className={`${t.card} rounded-3xl p-7 sm:p-9 text-center shadow-2xl`}>
                                <div className="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/30 p-2">
                                    <Logo className="w-full h-full object-contain" />
                                </div>
                                <h2 className={`text-xl font-black ${t.title}`}>Ujian Telah Selesai</h2>
                                <p className="text-xs text-indigo-600 dark:text-indigo-400 font-bold mt-0.5 uppercase tracking-wide">SMP Muhammadiyah PKBS Surakarta</p>
                                <p className={`text-xs ${t.sub} mt-1 mb-6`}>{selectedMapel} - {student.name}</p>

                                {lockoutReason && (
                                    <div className="bg-red-500/10 border border-red-500/40 rounded-2xl p-3 mb-4 text-xs text-red-600 dark:text-red-300 font-medium">{lockoutReason}</div>
                                )}

                                <div className={`${t.cardInner} p-6 rounded-2xl mb-4`}>
                                    <span className={`text-xs ${t.sub} uppercase tracking-wider block font-bold`}>Skor Soal Objektif</span>
                                    <span className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 my-2 block">{score.toFixed(0)}</span>
                                    <span className={`text-xs ${t.sub} block mb-1`}>Benar: <strong className={t.title}>{correct}</strong> dari {total} soal objektif</span>
                                    <span className="text-[11px] text-amber-600 dark:text-amber-400 italic font-medium">Soal Uraian dinilai terpisah oleh pengawas di lembar kertas.</span>
                                </div>

                                <p className={`text-[11px] ${t.sub} mb-5`}>
                                    {isSubmittingGas ? (
                                        <span><i className="fas fa-spinner fa-spin mr-1"></i> Mengirim jawaban ke server...</span>
                                    ) : gasUrl ? (
                                        <span><i className="fas fa-circle-check text-emerald-500 mr-1"></i> Jawaban telah dikirim ke server.</span>
                                    ) : (
                                        <span>Server database belum diatur.</span>
                                    )}
                                </p>

                                <button
                                    disabled={isSubmittingGas}
                                    onClick={() => { clearSessionState(); window.location.reload(); }}
                                    className="w-full py-3.5 bg-gradient-to-r from-indigo-600 hover:from-indigo-500 to-violet-600 hover:to-violet-500 disabled:opacity-60 text-white rounded-2xl font-bold text-xs sm:text-sm shadow-xl shadow-indigo-600/30 transition"
                                >
                                    Selesai & Kembali ke Login
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return withModals(null);
        }

        // ---------- Render ----------
        let rootInstance = null;
        function renderApp() {
            const rootEl = document.getElementById('root');
            if (!rootEl) return;
            try {
                if (ReactDOM.createRoot) {
                    if (!rootInstance) rootInstance = ReactDOM.createRoot(rootEl);
                    rootInstance.render(<ErrorBoundary><App /></ErrorBoundary>);
                } else {
                    ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, rootEl);
                }
            } catch (e) {
                console.error("Gagal mounting React:", e);
                rootEl.innerHTML = `<div style="color: white; padding: 20px; text-align: center;">Gagal memuat aplikasi: ${e.message}</div>`;
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderApp);
        } else {
            renderApp();
        }
    </script>
</body>
</html>
