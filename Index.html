<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT EXAM - SMP Muhammadiyah PKBS Surakarta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        img {
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-compact="true">
        const { useState, useEffect, useRef } = React;

        // =========================================================================
        // TEMPATKAN URL GOOGLE APPS SCRIPT ANDA DI SINI:
        // Masukkan URL Web App dari langkah Deploy Google Apps Script.
        // Siswa yang membuka link ini akan langsung otomatis terhubung ke database.
        // =========================================================================
        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbztLyZuduyezaFqLLGK8hkg71lsiVxmrYTLEhteNx8ZCKUCabi8s-EIjYdLSYbXsYSy5g/exec";

        const DEFAULT_QUESTIONS = [
            {
                mapel: "Pancasila & Kewarganegaraan",
                kelas: "Kelas X",
                id: 1,
                question: "Pancasila sebagai dasar negara Indonesia secara resmi disahkan pada tanggal...",
                options: ["1 Juni 1945", "17 Agustus 1945", "18 Agustus 1945", "22 Juni 1945"],
                correctAnswer: 2
            },
            {
                mapel: "Biologi",
                kelas: "Kelas X",
                id: 2,
                question: "Proses fotosintesis pada tumbuhan hijau menghasilkan oksigen dan...",
                options: ["Karbondioksida", "Glukosa", "Nitrogen", "Klorofil"],
                correctAnswer: 1
            },
            {
                mapel: "Matematika",
                kelas: "Kelas XI",
                id: 3,
                question: "Jika 3x + 7 = 22, maka nilai dari x + 5 adalah...",
                options: ["8", "10", "12", "15"],
                correctAnswer: 1
            }
        ];

        const MAX_VIOLATIONS = 3;
        const DURATION_MINUTES = 15;

        function App() {
            const [role, setRole] = useState('siswa'); // 'siswa' or 'guru'
            const [step, setStep] = useState('login'); // 'login', 'guru_dashboard', 'instructions', 'exam', 'result'
            
            // Student login state
            const [student, setStudent] = useState({ name: '', nisn: '', kelas: 'Kelas X', mapel: 'Pancasila & Kewarganegaraan', token: '' });
            const [loginMethod, setLoginMethod] = useState('token'); // 'token' or 'select'
            const [selectedMapel, setSelectedMapel] = useState('');
            const [selectedKelas, setSelectedKelas] = useState('Kelas X');
            
            // Teacher login & dashboard state
            const [teacherPass, setTeacherPass] = useState('');
            const [activeGuruMenu, setActiveGuruMenu] = useState('input_soal'); // 'input_soal', 'daftar_soal', 'hasil_ujian', 'generate_token'
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [deletingQId, setDeletingQId] = useState(null);
            const [filterDaftarMapel, setFilterDaftarMapel] = useState('ALL');
            const [filterDaftarKelas, setFilterDaftarKelas] = useState('ALL');
            
            // Database URL state
            const [gasUrl, setGasUrl] = useState(() => {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('gas') || localStorage.getItem('cbt_gas_url') || DEFAULT_GAS_URL;
            });

            const [questions, setQuestions] = useState(DEFAULT_QUESTIONS);
            const [mapelList] = useState(["Matematika", "Biologi", "Pancasila & Kewarganegaraan", "Bahasa Indonesia", "Fisika", "Kimia"]);
            const [kelasList] = useState(["Semua Kelas", "Kelas X", "Kelas XI", "Kelas XII"]);

            const [tokens, setTokens] = useState({
                "Matematika": "MTK882",
                "Biologi": "BIO123",
                "Pancasila & Kewarganegaraan": "CBT2026",
                "Bahasa Indonesia": "BIN771"
            });

            // Form Input Soal State (Guru)
            const [selectedMapelInput, setSelectedMapelInput] = useState('Pancasila & Kewarganegaraan');
            const [selectedKelasInput, setSelectedKelasInput] = useState('Kelas X');
            const [formQuestion, setFormQuestion] = useState({
                question: '',
                options: ['', '', '', ''],
                correctAnswer: 0
            });
            const [isSavingQuestion, setIsSavingQuestion] = useState(false);

            // Hasil Ujian Teacher State
            const [examResults, setExamResults] = useState([]);
            const [filterKelas, setFilterKelas] = useState('ALL');
            const [isLoadingResults, setIsLoadingResults] = useState(false);

            // Exam execution state
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [flagged, setFlagged] = useState({});
            const [timeLeft, setTimeLeft] = useState(DURATION_MINUTES * 60);
            const [violations, setViolations] = useState([]);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [showViolationModal, setShowViolationModal] = useState(false);
            const [showSubmitModal, setShowSubmitModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [lockoutReason, setLockoutReason] = useState('');
            const [lastViolationTime, setLastViolationTime] = useState(0);
            const [isSubmittingGas, setIsSubmittingGas] = useState(false);

            const timerRef = useRef(null);

            useEffect(() => {
                if (gasUrl) {
                    localStorage.setItem('cbt_gas_url', gasUrl);
                    fetchQuestionsFromGas(gasUrl);
                }
            }, [gasUrl]);

            const fetchQuestionsFromGas = async (targetUrl = gasUrl) => {
                if (!targetUrl) return;
                try {
                    const res = await fetch(targetUrl);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        // Normalize options to ensure max 4 options and valid array
                        const cleanedData = data.map(q => ({
                            ...q,
                            options: Array.isArray(q.options) ? q.options.slice(0, 4) : ["A", "B", "C", "D"],
                            correctAnswer: typeof q.correctAnswer === 'number' ? q.correctAnswer : 0
                        }));
                        setQuestions(cleanedData);
                    }
                } catch (err) {
                    console.error("Gagal mengambil soal dari Google Sheets:", err);
                }
            };

            const saveGasUrlSetting = (url) => {
                const trimmed = url.trim();
                setGasUrl(trimmed);
                localStorage.setItem('cbt_gas_url', trimmed);
                setShowSettingsModal(false);
                if (trimmed) fetchQuestionsFromGas(trimmed);
            };

            const addViolation = (reason) => {
                if (step !== 'exam') return;

                const now = Date.now();
                if (now - lastViolationTime < 1500) return;
                setLastViolationTime(now);

                const timestamp = new Date().toLocaleTimeString('id-ID');
                const newViolations = [...violations, { time: timestamp, reason }];
                setViolations(newViolations);

                if (newViolations.length >= MAX_VIOLATIONS) {
                    setLockoutReason(`Ujian dihentikan otomatis karena mencapai batas maksimum pelanggaran (${MAX_VIOLATIONS}x).`);
                    submitExam(true, `Mencapai batas ${MAX_VIOLATIONS} pelanggaran security.`);
                } else {
                    setShowViolationModal(true);
                }
            };

            useEffect(() => {
                if (step !== 'exam') return;

                const handleVisibilityChange = () => {
                    if (document.hidden) addViolation("Pindah Tab / Membuka Aplikasi Lain");
                };

                const handleWindowBlur = () => {
                    addViolation("Kursor/Fokus Tinggalkan Layar Ujian");
                };

                const handleFullscreenChange = () => {
                    const isFS = !!document.fullscreenElement;
                    setIsFullscreen(isFS);
                    if (!isFS && step === 'exam') {
                        addViolation("Keluar dari Mode Layar Penuh (Fullscreen)");
                    }
                };

                const handleKeyDown = (e) => {
                    if (
                        e.key === 'F12' ||
                        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                        (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'c' || e.key === 'C' || e.key === 'v' || e.key === 'V' || e.key === 'a' || e.key === 'A' || e.key === 'p' || e.key === 'P')) ||
                        e.key === 'PrintScreen'
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        addViolation(`Percobaan Kombinasi Tombol Terlarang (${e.key})`);
                        return false;
                    }
                };

                const handleContextMenu = (e) => {
                    e.preventDefault();
                    addViolation("Klik Kanan Terdeteksi");
                    return false;
                };

                const handleCopyPaste = (e) => {
                    e.preventDefault();
                    addViolation("Percobaan Salin / Tempel Teks (Copy-Paste)");
                    return false;
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('blur', handleWindowBlur);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                window.addEventListener('keydown', handleKeyDown);
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('copy', handleCopyPaste);
                document.addEventListener('paste', handleCopyPaste);
                document.addEventListener('cut', handleCopyPaste);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('blur', handleWindowBlur);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    window.removeEventListener('keydown', handleKeyDown);
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('copy', handleCopyPaste);
                    document.removeEventListener('paste', handleCopyPaste);
                    document.removeEventListener('cut', handleCopyPaste);
                };
            }, [step, violations, lastViolationTime]);

            useEffect(() => {
                if (step === 'exam') {
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                submitExam(false, "Waktu Ujian telah habis.");
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    if (timerRef.current) clearInterval(timerRef.current);
                }

                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [step]);

            const requestFullscreenMode = () => {
                const element = document.documentElement;
                if (element.requestFullscreen) {
                    element.requestFullscreen().then(() => {
                        setIsFullscreen(true);
                    }).catch(() => {});
                }
            };

            const handleTeacherLogin = () => {
                if (teacherPass === 'guru123') {
                    setStep('guru_dashboard');
                    if (gasUrl) fetchResultsFromGas();
                } else {
                    alert("Password Guru Salah! Gunakan password bawaan: guru123");
                }
            };

            const startStudentExam = () => {
                if (!student.name || !student.nisn) {
                    alert("Mohon lengkapi Nama Lengkap dan NISN!");
                    return;
                }

                let targetMapel = student.mapel;

                if (loginMethod === 'token') {
                    if (!student.token) {
                        alert("Mohon masukkan Token Ujian dari Guru!");
                        return;
                    }
                    const matchedMapel = Object.keys(tokens).find(m => tokens[m].toUpperCase() === student.token.trim().toUpperCase());
                    if (!matchedMapel) {
                        alert("Token Ujian Tidak Valid! Silakan tanyakan token aktif kepada Guru.");
                        return;
                    }
                    targetMapel = matchedMapel;
                }

                // Filter available questions for this mapel and kelas
                const mapelQuestions = questions.filter(q => {
                    const matchM = !q.mapel || q.mapel.toLowerCase() === targetMapel.toLowerCase();
                    const matchK = !q.kelas || q.kelas === 'Semua Kelas' || q.kelas.toLowerCase() === student.kelas.toLowerCase();
                    return matchM && matchK;
                });

                if (mapelQuestions.length === 0) {
                    // Fallback to mapel-only filter if specific class filter has no questions yet
                    const mapelOnly = questions.filter(q => !q.mapel || q.mapel.toLowerCase() === targetMapel.toLowerCase());
                    if (mapelOnly.length === 0) {
                        alert(`Belum ada soal tersedia untuk Mata Pelajaran "${targetMapel}".`);
                        return;
                    }
                }

                setSelectedMapel(targetMapel);
                setSelectedKelas(student.kelas);
                setStep('instructions');
            };

            const beginTest = () => {
                requestFullscreenMode();
                setStep('exam');
            };

            const submitExam = async (forced = false, reason = '') => {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                setShowSubmitModal(false);
                setShowViolationModal(false);
                setStep('result');

                if (gasUrl) {
                    setIsSubmittingGas(true);
                    const { correct, total, score } = calculateScore();
                    const payload = {
                        action: 'submitExam',
                        name: student.name,
                        nisn: student.nisn,
                        kelas: student.kelas,
                        mapel: selectedMapel,
                        score: score.toFixed(1),
                        correct: correct,
                        total: total,
                        violationsCount: violations.length,
                        violationDetails: violations.map(v => `[${v.time}] ${v.reason}`).join(' | ') || 'Tidak ada pelanggaran',
                        status: reason || (forced ? 'Diskualifikasi / Dihentikan Sistem' : 'Selesai Tepat Waktu')
                    };

                    try {
                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });
                    } catch (e) {
                        console.error("Gagal mengirim data ke Google Sheets", e);
                    } finally {
                        setIsSubmittingGas(false);
                    }
                }
            };

            const getActiveQuestions = () => {
                const mapelQuestions = questions.filter(q => {
                    const matchM = !q.mapel || q.mapel.toLowerCase() === selectedMapel.toLowerCase();
                    const matchK = !q.kelas || q.kelas === 'Semua Kelas' || q.kelas.toLowerCase() === selectedKelas.toLowerCase();
                    return matchM && matchK;
                });
                return mapelQuestions.length > 0 ? mapelQuestions : questions.filter(q => !q.mapel || q.mapel.toLowerCase() === selectedMapel.toLowerCase());
            };

            const calculateScore = () => {
                const activeQ = getActiveQuestions();
                const total = activeQ.length || 1;
                let correct = 0;
                activeQ.forEach((q) => {
                    if (answers[q.id] === q.correctAnswer) {
                        correct++;
                    }
                });
                const score = (correct / total) * 100;
                return { correct, total, score };
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleSaveQuestion = async () => {
                if (!selectedMapelInput) {
                    alert("Wajib memilih Mata Pelajaran!");
                    return;
                }
                if (!selectedKelasInput) {
                    alert("Wajib memilih Tingkat Kelas!");
                    return;
                }
                if (!formQuestion.question.trim()) {
                    alert("Isi soal/pertanyaan tidak boleh kosong!");
                    return;
                }
                if (formQuestion.options.some(opt => !opt.trim())) {
                    alert("Semua 4 opsi pilihan jawaban (A, B, C, D) wajib diisi!");
                    return;
                }

                setIsSavingQuestion(true);

                const newQ = {
                    mapel: selectedMapelInput,
                    kelas: selectedKelasInput,
                    id: questions.length + 1,
                    question: formQuestion.question,
                    options: [...formQuestion.options],
                    correctAnswer: parseInt(formQuestion.correctAnswer)
                };

                setQuestions([...questions, newQ]);

                if (gasUrl) {
                    try {
                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify({
                                action: 'addQuestion',
                                ...newQ
                            })
                        });
                        alert("Berhasil! Soal telah tersimpan di Google Spreadsheet.");
                    } catch (e) {
                        alert("Soal tersimpan di memori lokal, namun gagal sync ke Google Sheets.");
                    }
                } else {
                    alert("Soal berhasil disimpan ke memori lokal!");
                }

                handleResetFormQuestion();
                setIsSavingQuestion(false);
            };

            const handleResetFormQuestion = () => {
                setFormQuestion({
                    question: '',
                    options: ['', '', '', ''],
                    correctAnswer: 0
                });
            };

            const generateNewToken = (mapel) => {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let result = '';
                for (let i = 0; i < 6; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                setTokens({ ...tokens, [mapel]: result });
            };

            const handleSaveEditQuestion = () => {
                if (!editingQuestion) return;
                if (!editingQuestion.question.trim()) return;
                if (editingQuestion.options.some(opt => !opt.trim())) return;

                setQuestions(prev => prev.map(q => q.id === editingQuestion.id ? editingQuestion : q));
                setEditingQuestion(null);
            };

            const confirmDeleteQuestion = () => {
                if (!deletingQId) return;
                setQuestions(prev => prev.filter(q => q.id !== deletingQId));
                setDeletingQId(null);
            };

            const fetchResultsFromGas = async () => {
                if (!gasUrl) return;
                setIsLoadingResults(true);
                try {
                    const res = await fetch(`${gasUrl}?action=getResults`);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setExamResults(data);
                    }
                } catch (err) {
                    console.error("Gagal menarik hasil ujian:", err);
                } finally {
                    setIsLoadingResults(false);
                }
            };

            if (step === 'login') {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl">
                            <div className="text-center mb-6">
                                <div className="w-16 h-16 bg-slate-950 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-700 p-2 shadow-inner">
                                    <img 
                                        src="https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-" 
                                        alt="Logo SMP Muhammadiyah PKBS Surakarta" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
                                        }}
                                    />
                                </div>
                                <h1 className="text-2xl font-extrabold text-white tracking-wide">CBT EXAM</h1>
                                <p className="text-blue-400 font-semibold text-sm mt-1">SMP Muhammadiyah PKBS Surakarta</p>
                            </div>

                            <div className="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-700">
                                <button
                                    onClick={() => setRole('siswa')}
                                    className={`flex-1 py-2 rounded-lg text-xs font-semibold transition ${role === 'siswa' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <i className="fas fa-user-graduate mr-1.5"></i> Portal Siswa
                                </button>
                                <button
                                    onClick={() => setRole('guru')}
                                    className={`flex-1 py-2 rounded-lg text-xs font-semibold transition ${role === 'guru' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                >
                                    <i className="fas fa-chalkboard-user mr-1.5"></i> Portal Guru
                                </button>
                            </div>

                            {role === 'siswa' && (
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-300 mb-1">Nama Lengkap Siswa</label>
                                        <input
                                            type="text"
                                            placeholder="Contoh: Ahmad Subagja"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                            value={student.name}
                                            onChange={(e) => setStudent({ ...student, name: e.target.value })}
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">NISN / ID Siswa</label>
                                            <input
                                                type="text"
                                                placeholder="00123456"
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                                value={student.nisn}
                                                onChange={(e) => setStudent({ ...student, nisn: e.target.value })}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Kelas Siswa</label>
                                            <select
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                                value={student.kelas}
                                                onChange={(e) => setStudent({ ...student, kelas: e.target.value })}
                                            >
                                                <option value="Kelas X">Kelas X</option>
                                                <option value="Kelas XI">Kelas XI</option>
                                                <option value="Kelas XII">Kelas XII</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Login method selection for students */}
                                    <div className="flex justify-between items-center text-xs pt-1">
                                        <span className="text-slate-400 font-medium">Metode Masuk Ujian:</span>
                                        <div className="flex gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setLoginMethod('token')}
                                                className={`px-2.5 py-1 rounded-md transition ${loginMethod === 'token' ? 'bg-blue-600/30 text-blue-400 border border-blue-500/50' : 'text-slate-500 hover:text-slate-300'}`}
                                            >
                                                Pakai Token
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setLoginMethod('select')}
                                                className={`px-2.5 py-1 rounded-md transition ${loginMethod === 'select' ? 'bg-blue-600/30 text-blue-400 border border-blue-500/50' : 'text-slate-500 hover:text-slate-300'}`}
                                            >
                                                Pilih Mapel
                                            </button>
                                        </div>
                                    </div>

                                    {loginMethod === 'token' ? (
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Token Ujian (Dari Guru)</label>
                                            <input
                                                type="text"
                                                placeholder="Contoh: CBT2026 / MTK882"
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-amber-400 font-mono tracking-widest uppercase focus:outline-none focus:border-amber-500"
                                                value={student.token}
                                                onChange={(e) => setStudent({ ...student, token: e.target.value })}
                                            />
                                        </div>
                                    ) : (
                                        <div>
                                            <label className="block text-xs font-medium text-slate-300 mb-1">Mata Pelajaran Ujian</label>
                                            <select

                                                        <h3 className="text-xs font-bold text-white">{m}</h3>
                                                        <p className="text-[10px] text-slate-400 mt-0.5">Token Aktif:</p>
                                                        <span className="font-mono text-base font-extrabold text-amber-400 tracking-wider">
                                                            {tokens[m] || 'BELUM DI-GENERATE'}
                                                        </span>
                                                    </div>

                                                    <button
                                                        onClick={() => generateNewToken(m)}
                                                        className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-blue-600/30"
                                                    >
                                                        <i className="fas fa-arrows-rotate"></i>
                                                        <span>Generate</span>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Modal Edit Soal */}
                        {editingQuestion && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-4">
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <i className="fas fa-pen-to-square text-amber-400"></i> Edit Soal
                                    </h3>

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Teks Pertanyaan</label>
                                        <textarea
                                            rows="3"
                                            className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500"
                                            value={editingQuestion.question}
                                            onChange={(e) => setEditingQuestion({ ...editingQuestion, question: e.target.value })}
                                        ></textarea>
                                    </div>

                                    {['A', 'B', 'C', 'D'].map((letter, optIdx) => (
                                        <div key={optIdx} className="flex items-center gap-2">
                                            <input
                                                type="radio"
                                                name="editCorrect"
                                                checked={editingQuestion.correctAnswer === optIdx}
                                                onChange={() => setEditingQuestion({ ...editingQuestion, correctAnswer: optIdx })}
                                                className="accent-amber-500"
                                            />
                                            <span className="text-xs font-bold text-amber-400 w-4">{letter}.</span>
                                            <input
                                                type="text"
                                                className="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white"
                                                value={editingQuestion.options[optIdx] || ''}
                                                onChange={(e) => {
                                                    const newOpts = [...editingQuestion.options];
                                                    newOpts[optIdx] = e.target.value;
                                                    setEditingQuestion({ ...editingQuestion, options: newOpts });
                                                }}
                                            />
                                        </div>
                                    ))}

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button
                                            onClick={() => setEditingQuestion(null)}
                                            className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            onClick={handleSaveEditQuestion}
                                            className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-semibold"
                                        >
                                            Simpan Perubahan
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal Hapus Soal */}
                        {deletingQId && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center space-y-4">
                                    <div className="w-12 h-12 bg-red-500/20 text-red-400 rounded-2xl flex items-center justify-center mx-auto border border-red-500/30">
                                        <i className="fas fa-trash-can text-xl"></i>
                                    </div>
                                    <h3 className="text-base font-bold text-white">Konfirmasi Hapus Soal</h3>
                                    <p className="text-xs text-slate-400">Apakah Anda yakin ingin menghapus soal ini dari bank soal?</p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setDeletingQId(null)}
                                            className="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            onClick={confirmDeleteQuestion}
                                            className="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold"
                                        >
                                            Ya, Hapus
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (step === 'instructions') {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 max-w-lg w-full text-white">
                            <div className="text-center mb-6">
                                <div className="w-16 h-16 bg-slate-900/60 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-700 p-2">
                                    <img 
                                        src="https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-" 
                                        alt="Logo SMP Muhammadiyah PKBS Surakarta" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
                                        }}
                                    />
                                </div>
                                <h2 className="text-xl font-bold">Petunjuk & Aturan Ujian</h2>
                                <p className="text-xs text-blue-400 font-medium mt-0.5">SMP Muhammadiyah PKBS Surakarta</p>
                                <p className="text-xs text-slate-400 mt-0.5">{selectedMapel} - {student.kelas}</p>
                            </div>

                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3 mb-6 text-xs text-slate-300">
                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                    <span className="text-slate-400">Nama Peserta:</span>
                                    <span className="font-semibold text-white">{student.name}</span>
                                </div>
                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                    <span className="text-slate-400">NISN:</span>
                                    <span className="font-semibold text-white">{student.nisn}</span>
                                </div>
                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                    <span className="text-slate-400">Durasi Pengerjaan:</span>
                                    <span className="font-semibold text-amber-400">{DURATION_MINUTES} Menit</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-slate-400">Batas Pelanggaran:</span>
                                    <span className="font-semibold text-red-400">Maksimal {MAX_VIOLATIONS} Kali</span>
                                </div>
                            </div>

                            <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 mb-6 text-xs text-amber-200 space-y-1.5">
                                <div className="font-bold flex items-center gap-1.5 mb-1 text-amber-400">
                                    <i className="fas fa-triangle-exclamation"></i> PERHATIAN PENTING:
                                </div>
                                <p>1. Ujian akan berjalan dalam mode <strong>Layar Penuh (Fullscreen)</strong>.</p>
                                <p>2. Dilarang membuka tab lain, berpindah aplikasi, atau menekan tombol F12/PrintScreen.</p>
                                <p>3. Jika melakukan pelanggaran sebanyak {MAX_VIOLATIONS}x, sistem akan <strong>MENGHENTIKAN UJIAN SECARA OTOMATIS</strong>.</p>
                            </div>

                            <button
                                onClick={beginTest}
                                className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2"
                            >
                                <i className="fas fa-play"></i>
                                <span>Saya Mengerti & Mulai Ujian</span>
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === 'exam') {
                const activeQ = getActiveQuestions();
                const currentQ = activeQ[currentQIndex] || activeQ[0];

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                        <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-slate-950 rounded-lg flex items-center justify-center border border-slate-700 p-1">
                                    <img 
                                        src="https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-" 
                                        alt="Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
                                        }}
                                    />
                                </div>
                                <div>
                                    <h1 className="text-xs sm:text-sm font-bold text-white line-clamp-1">{selectedMapel}</h1>
                                    <p className="text-[10px] text-slate-400">{student.name} ({student.kelas})</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                <div className={`px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1.5 ${violations.length > 0 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                    <i className="fas fa-shield-halved"></i>
                                    <span>{violations.length}/{MAX_VIOLATIONS}</span>
                                </div>

                                <div className={`px-3 py-1 rounded-lg font-mono text-xs sm:text-sm font-bold flex items-center gap-2 ${timeLeft < 180 ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-800 text-amber-400 border border-slate-700'}`}>
                                    <i className="fas fa-clock"></i>
                                    <span>{formatTime(timeLeft)}</span>
                                </div>

                                <button
                                    onClick={() => setShowSubmitModal(true)}
                                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition"
                                >
                                    Selesai Ujian
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 p-4 sm:p-6 max-w-6xl w-full mx-auto flex flex-col md:flex-row gap-6">
                            <div className="flex-1 flex flex-col justify-between bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6">
                                {currentQ ? (
                                    <div>
                                        <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                                            <span className="text-xs font-bold text-blue-400 bg-blue-600/10 px-3 py-1 rounded-lg border border-blue-500/20">
                                                Soal No. {currentQIndex + 1} / {activeQ.length}
                                            </span>
                                            <button
                                                onClick={() => setFlagged({ ...flagged, [currentQ.id]: !flagged[currentQ.id] })}
                                                className={`px-3 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition ${flagged[currentQ.id] ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                                            >
                                                <i className="fas fa-bookmark"></i>
                                                <span>Ragu-ragu</span>
                                            </button>
                                        </div>

                                        <p className="text-sm sm:text-base font-medium text-white mb-6 leading-relaxed">
                                            {currentQ.question}
                                        </p>

                                        <div className="space-y-3">
                                            {(Array.isArray(currentQ.options) ? currentQ.options : []).map((opt, optIdx) => {
                                                const isSelected = answers[currentQ.id] === optIdx;
                                                return (
                                                    <button
                                                        key={optIdx}
                                                        onClick={() => setAnswers({ ...answers, [currentQ.id]: optIdx })}
                                                        className={`w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm flex items-center gap-3 transition ${isSelected ? 'bg-blue-600/20 border-blue-500 text-white font-semibold shadow-md' : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800'}`}
                                                    >
                                                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                            {String.fromCharCode(65 + optIdx)}
                                                        </span>
                                                        <span className="flex-1">{opt}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-10 text-slate-400 text-xs">Tidak ada soal tersedia untuk mata pelajaran ini.</div>
                                )}

                                <div className="flex justify-between items-center gap-3 mt-8 pt-4 border-t border-slate-800">
                                    <button
                                        disabled={currentQIndex === 0}
                                        onClick={() => setCurrentQIndex(prev => prev - 1)}
                                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
                                    >
                                        <i className="fas fa-chevron-left"></i>
                                        <span>Sebelumnya</span>
                                    </button>

                                    {currentQIndex === activeQ.length - 1 ? (
                                        <button
                                            onClick={() => setShowSubmitModal(true)}
                                            className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/30"
                                        >
                                            <span>Kumpulkan</span>
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    ) : (
                                        <button
                                            onClick={() => setCurrentQIndex(prev => prev + 1)}
                                            className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
                                        >
                                            <span>Selanjutnya</span>
                                            <i className="fas fa-chevron-right"></i>
                                        </button>
                                    )}
                                </div>
                            </div>

                            <div className="w-full md:w-64 bg-slate-900 border border-slate-800 rounded-2xl p-4 h-fit">
                                <h3 className="text-xs font-bold text-slate-300 mb-3 border-b border-slate-800 pb-2">
                                    Navigasi Nomor Soal
                                </h3>
                                <div className="grid grid-cols-5 gap-2">
                                    {activeQ.map((q, idx) => {
                                        const isAnswered = answers[q.id] !== undefined;
                                        const isFlagged = flagged[q.id];
                                        const isCurrent = currentQIndex === idx;

                                        let btnClass = 'bg-slate-950 text-slate-400 border-slate-800';
                                        if (isCurrent) btnClass = 'ring-2 ring-blue-500 bg-blue-600 text-white font-bold';
                                        else if (isFlagged) btnClass = 'bg-amber-500 text-slate-950 font-bold';
                                        else if (isAnswered) btnClass = 'bg-emerald-600 text-white font-semibold';

                                        return (
                                            <button
                                                key={q.id || idx}
                                                onClick={() => setCurrentQIndex(idx)}
                                                className={`h-9 rounded-lg text-xs border transition flex items-center justify-center ${btnClass}`}
                                            >
                                                {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {showViolationModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-red-500/50 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                                    <div className="w-14 h-14 bg-red-500/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-red-500/30 animate-bounce">
                                        <i className="fas fa-triangle-exclamation text-2xl"></i>
                                    </div>
                                    <h3 className="text-base font-bold text-white mb-1">PERINGATAN PELANGGARAN!</h3>
                                    <p className="text-xs text-red-400 font-medium mb-3">
                                        {violations[violations.length - 1]?.reason || "Tindakan kecurangan terdeteksi!"}
                                    </p>
                                    <p className="text-[11px] text-slate-400 mb-5">
                                        Pelanggaran ke-<strong>{violations.length}</strong> dari maksimal <strong>{MAX_VIOLATIONS}</strong>x.
                                    </p>
                                    <button
                                        onClick={() => {
                                            setShowViolationModal(false);
                                            requestFullscreenMode();
                                        }}
                                        className="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-red-600/30"
                                    >
                                        SAYA MENGERTI & KEMBALI UJIAN
                                    </button>
                                </div>
                            </div>
                        )}

                        {showSubmitModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                                    <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/30">
                                        <i className="fas fa-paper-plane text-xl"></i>
                                    </div>
                                    <h3 className="text-base font-bold text-white mb-1">Kumpulkan Ujian?</h3>
                                    <p className="text-xs text-slate-400 mb-5">
                                        Terjawab: <strong className="text-emerald-400">{Object.keys(answers).length}</strong> dari {activeQ.length} Soal.
                                    </p>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setShowSubmitModal(false)}
                                            className="flex-1 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold hover:bg-slate-700 transition"
                                        >
                                            Kembali Pengerjaan
                                        </button>
                                        <button
                                            onClick={() => submitExam(false, "Selesai Tepat Waktu")}
                                            className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-emerald-600/30"
                                        >
                                            Ya, Selesai
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (step === 'result') {
                const { correct, total, score } = calculateScore();
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 max-w-md w-full text-center">
                            <div className="w-16 h-16 bg-slate-900/60 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-700 p-2">
                                <img 
                                    src="https://lh3.googleusercontent.com/d/1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-" 
                                    alt="Logo SMP Muhammadiyah PKBS Surakarta" 
                                    className="w-full h-full object-contain"
                                    onError={(e) => {
                                        e.target.onerror = null; 
                                        e.target.src = "https://drive.google.com/uc?export=view&id=1H7HH5EXSS5dYsrGcy8RbTAX5x3hEFr1-";
                                    }}
                                />
                            </div>
                            <h2 className="text-xl font-bold text-white">Ujian Telah Selesai</h2>
                            <p className="text-xs text-blue-400 font-medium mt-0.5">SMP Muhammadiyah PKBS Surakarta</p>
                            <p className="text-xs text-slate-400 mt-1 mb-6">{selectedMapel} - {student.name}</p>

                            <div className="bg-slate-900 p-6 rounded-xl border border-slate-700 mb-6">
                                <span className="text-xs text-slate-500 uppercase tracking-wider block font-semibold">Skor Akhir Siswa</span>
                                <span className="text-5xl font-extrabold text-blue-500 my-2 block">{score.toFixed(0)}</span>
                                <span className="text-xs text-slate-400">Jawaban Benar: <strong className="text-white">{correct}</strong> dari {total} soal</span>
                            </div>

                            <button
                                onClick={() => window.location.reload()}
                                className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs transition"
                            >
                                Kembali ke Halaman Login
                            </button>
                        </div>
                    </div>
                );
            }

            return null;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
